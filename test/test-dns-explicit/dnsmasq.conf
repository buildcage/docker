# Resolve the fake test domains (and all subdomains, e.g. sub.wildcard.example.com)
# to the test-server IP.
address=/allowed.example.com/10.200.0.100
address=/blocked.example.com/10.200.0.100
address=/wildcard.example.com/10.200.0.100
# Return NXDOMAIN for this domain (no IP = NXDOMAIN in dnsmasq 2.86+). More
# specific than the wildcard.example.com rule above, so it takes precedence.
address=/nxdomain.wildcard.example.com/
# Forward everything else to a real upstream resolver. Transparent-mode tests
# never query this server for anything but the fake domains above (HAProxy's
# resolver only looks up domains actually requested during the RUN steps), so
# this is a no-op change for them. Explicit-mode tests point the builder
# container's own /etc/resolv.conf at this server (buildkit-proxy has no
# dnsmasq of its own), so real domains like registry-1.docker.io (needed for
# FROM image pulls) must still resolve.
server=1.1.1.1
server=8.8.8.8
