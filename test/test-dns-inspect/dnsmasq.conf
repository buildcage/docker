# Upstream resolver for the inspect engine's HAProxy, which queries it
# directly -- never through CoreDNS -- once a request has already passed the
# rules. CoreDNS itself never forwards a query here, or anywhere: it always
# answers locally with the proxy's own address, allowed name or not.
address=/allowed.example.com/10.200.0.100
address=/blocked.example.com/10.200.0.100
address=/wildcard.example.com/10.200.0.100
address=/api.example.com/10.200.0.100
address=/tlspass.example.com/10.200.0.100

# Allowlisted by the rules but genuinely absent upstream, which is the only way
# to reach the proxy's "name did not resolve" path (502). A name that is merely
# not allowlisted never gets this far.
address=/absent.example.com/

# AAAA only. Without `local=` the A query would be forwarded upstream rather
# than answered empty.
local=/v6only.example.com/
host-record=v6only.example.com,2001:db8::1

# An allowlisted name that resolves to cloud metadata, as an attacker
# controlling DNS for an allowed domain could arrange. The proxy must refuse to
# connect there rather than reach it from its own network position.
address=/metadata.example.com/169.254.169.254

# Allowlisted name resolving to a runner address (HOST_ADDRESSES in
# compose.test-inspect.yaml), which would otherwise reach the runner's published
# ports: RFC1918 is exempt on purpose.
address=/runner.example.com/10.200.0.199

# The impostor origin, reachable only by address. Nothing resolves to it.

# Forward anything else to a real upstream: the builder resolves FROM pulls
# through this server too.
server=1.1.1.1
server=8.8.8.8
