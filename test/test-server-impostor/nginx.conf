events {
    worker_connections 128;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr;

    # Reaching this body at all means the destination came from the client
    # rather than from the proxy's own resolution.
    server {
        listen 80;
        listen 443 ssl;
        ssl_certificate     /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;
        location / { return 200 "IMPOSTOR $request_method $uri\n"; }
    }
}
