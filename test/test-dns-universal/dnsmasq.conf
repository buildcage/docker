# Upstream resolver for the universal engine's HAProxy, reached through
# Docker's embedded DNS once a request has already passed the rules.
address=/allowed.example.com/10.200.0.100
address=/blocked.example.com/10.200.0.100
address=/wildcard.example.com/10.200.0.100
# Hosts for the `~` regex rules.
address=/regex.example.com/10.200.0.100
# Return NXDOMAIN for this domain (no IP = NXDOMAIN in dnsmasq 2.86+). More
# specific than the wildcard.example.com rule above, so it takes precedence.
address=/nxdomain.wildcard.example.com/
# AAAA only. An `address=` line carrying just an IPv6 would leave A falling
# through to the broader wildcard.example.com entry above.
local=/v6only.wildcard.example.com/
host-record=v6only.wildcard.example.com,2001:db8::1
# Allowlisted name resolving to a link-local address (AWS/GCP/Azure IMDS).
address=/internal.wildcard.example.com/169.254.169.254
# Allowlisted name resolving to a runner address (the proxy's HOST_ADDRESSES in
# these tests). RFC1918 is allowed, so only that list blocks it.
address=/runner.wildcard.example.com/10.200.0.199

# Not hermetic: buildkitd resolves FROM pulls through this server too, and
# test/Dockerfile.inspect-byte-exact bootstraps apt over the real archive.
server=1.1.1.1
server=8.8.8.8
