services:
  sandbox:
    container_name: ${SANDBOX_CONTAINER_NAME:-buildcage-sandbox}
    image: ${BUILDCAGE_SANDBOX_IMAGE_REF:-placeholder}
    # No buildkitd/runc in this image, so unlike setup/compose.yaml's builder
    # service, only NET_ADMIN is needed (bridge creation + iptables) — no
    # SYS_ADMIN/SYS_PTRACE, no cgroup:host, no default-seccomp/apparmor bypass.
    cap_add:
      - NET_ADMIN
    environment:
      - PROXY_MODE=${PROXY_MODE:-restrict}
      - ALLOWED_HTTPS_RULES=${ALLOWED_HTTPS_RULES:-}
      - ALLOWED_HTTP_RULES=${ALLOWED_HTTP_RULES:-}
      - ALLOWED_IP_RULES=${ALLOWED_IP_RULES:-}
      - EXTERNAL_RESOLVER=${EXTERNAL_RESOLVER:-}
    restart: unless-stopped
