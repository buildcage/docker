name: "Buildcage for Docker"
description: "Restrict outbound network access during docker build to an allowlist of domains"
branding:
  icon: package
  color: blue

inputs:
  builder_name:
    description: "Name of the builder container"
    required: false
    default: "buildcage"
  proxy_mode:
    description: "audit or restrict"
    required: false
    default: "restrict"
  proxy_engine:
    description: "Network enforcement engine: universal (network-level proxy, default, needs no CA trust; 'transparent' is accepted as an alias), inspect (terminates TLS to enforce on method and URL; see docs/inspect-engine.md) or explicit (BuildKit's native --proxy-network; deprecated, see docs/explicit-engine.md)"
    required: false
    default: "universal"
  allowed_https_rules:
    description: "HTTPS allow rules (wildcard or ~regex), separated by whitespace. Port required. e.g., '*.example.com:443 ~^custom\\.pattern:443$'"
    required: false
    default: ""
  allowed_http_rules:
    description: "HTTP allow rules (wildcard or ~regex), separated by whitespace. Port required. e.g., 'example.com:80'"
    required: false
    default: ""
  allowed_ip_rules:
    description: "IP address allow rules (wildcard or ~regex), separated by whitespace. Port required. e.g., '192.168.1.1:443 10.0.0.1:8080'"
    required: false
    default: ""
  allowed_url_rules:
    description: "URL allow rules, one per line, as '<methods> <url>'. Methods are separated by | or , and * means any. Requires proxy_engine: inspect. e.g., 'GET|HEAD https://registry.npmjs.org/**'"
    required: false
    default: ""
  allow_tls_rules:
    description: "TLS destinations passed through undecrypted, judged on SNI alone, separated by whitespace. Port required. Requires proxy_engine: inspect. e.g., 'db.example.com:5432'"
    required: false
    default: ""
  known_blocked_rules:
    description: "Domains expected to be blocked intentionally (wildcard or ~regex), separated by whitespace. Port required. Blocked connections matching these rules don't fail the report step even when fail_on_blocked is true — only unmatched (unexpected) blocked connections do. e.g., 'known-noisy.example.com:443'"
    required: false
    default: ""

runs:
  using: node24
  main: dist/main.cjs
  post: dist/post.cjs
