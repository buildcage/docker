name: "Buildcage for Docker"
description: "Restrict outbound network access during docker build to an allowlist of domains"
branding:
  icon: package
  color: blue

inputs:
  builder_name:
    description: "Name of the builder container"
    required: false
    default: "buildcage"
  proxy_mode:
    description: "Traffic policy: audit records every destination the build reaches and blocks nothing (allowed_*_rules have no effect in this mode), or restrict (default) allows only what the rules match and blocks the rest. Run audit once, take the allowlist from its report, then switch to restrict."
    required: false
    default: "restrict"
  proxy_engine:
    description: "Network enforcement engine: inspect (default, terminates TLS to enforce on method and URL) or universal (network-level proxy, needs no CA trust)"
    required: false
    default: "inspect"
  allowed_https_rules:
    description: "HTTPS allow rules (wildcard or ~regex), separated by whitespace. Port required. e.g., '*.example.com:443 ~^custom\\.pattern:443$'"
    required: false
    default: ""
  allowed_http_rules:
    description: "HTTP allow rules (wildcard or ~regex), separated by whitespace. Port required. e.g., 'example.com:80'"
    required: false
    default: ""
  allowed_ip_rules:
    description: "IP address allow rules (wildcard or ~regex), separated by whitespace. Port required. e.g., '192.168.1.1:443 10.0.0.1:8080'"
    required: false
    default: ""
  allowed_url_rules:
    description: "URL allow rules, one per line, as '<methods> <url>'. Methods are separated by | or , and * means any. Requires proxy_engine: inspect. e.g., 'GET|HEAD https://registry.npmjs.org/**'"
    required: false
    default: ""
  allowed_tls_rules:
    description: "TLS destinations passed through undecrypted, judged on SNI alone, separated by whitespace. Port required. Requires proxy_engine: inspect. e.g., 'db.example.com:5432'"
    required: false
    default: ""
  fail_on_ca_residue:
    description: "proxy_engine: inspect only. Whether a RUN step that leaves a copy of the proxy CA in its layer where it cannot be removed, or that writes to the NSS database Chromium reads, fails the build (true, default) or only warns (false). With false, that copy stays in the image, and the step's writes to the NSS database are discarded."
    required: false
    default: "true"
  known_blocked_rules:
    description: "Domains expected to be blocked intentionally (wildcard or ~regex), separated by whitespace. A rule that names no port matches any port, a refused name having none. Blocked connections matching these rules don't fail the report step even when fail_on_blocked is true; only unmatched (unexpected) blocked connections do. e.g., 'known-noisy.example.com:443'"
    required: false
    default: ""

runs:
  using: node24
  main: dist/main.cjs
  post: dist/post.cjs
