name: Verify dist
description: Rebuild the committed dist bundles and license file, and confirm they match the source
# Callers must run actions/checkout and ./.github/actions/setup-vp first.

runs:
  using: composite
  steps:
    - name: Build
      shell: bash
      run: vp run build

    - name: Check dist and THIRD_PARTY_LICENSES_NPM are up to date
      shell: bash
      run: git diff --exit-code

    # git diff only sees tracked files, so a build that starts emitting a new
    # chunk would pass it unnoticed.
    - name: Check the build emitted no untracked output
      shell: bash
      run: |
        UNTRACKED=$(git status --porcelain -- dist report/dist)
        if [ -n "$UNTRACKED" ]; then
          echo "::error::The build produced output that is not committed:"
          echo "$UNTRACKED"
          exit 1
        fi

    - name: Check dist is free of the test hooks
      shell: bash
      run: "$GITHUB_ACTION_PATH/check-test-hooks.sh"
