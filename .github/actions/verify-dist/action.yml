name: Verify dist
description: Rebuild the committed dist bundles and license file, and confirm they match the source
# Callers must run actions/checkout and ./.github/actions/setup-vp first.

runs:
  using: composite
  steps:
    - name: Build
      shell: bash
      run: vp run build

    - name: Check dist and THIRD_PARTY_LICENSES_NPM are up to date
      shell: bash
      run: git diff --exit-code

    # git diff only sees tracked files, so a build that starts emitting a new
    # chunk would pass it unnoticed.
    - name: Check the build emitted no untracked output
      shell: bash
      run: |
        UNTRACKED=$(git status --porcelain -- dist report/dist)
        if [ -n "$UNTRACKED" ]; then
          echo "::error::The build produced output that is not committed:"
          echo "$UNTRACKED"
          exit 1
        fi

    # Match the names, not one spelling of the gate: replacePlugin leaves other
    # spellings, such as a destructured read of process.env, in place.
    - name: Check dist is free of the test hooks
      shell: bash
      run: |
        for f in dist/main.cjs dist/post.cjs report/dist/main.cjs; do
          if grep -noE 'BUILDCAGE_(BUILD_TEST_HOOKS|LOCAL_IMAGE_REF|TEST_COMPOSE_FILE)' "$f"; then
            echo "::error::$f references a test-hook variable; a normal build must not contain the test hooks (see rolldown.config.js)."
            exit 1
          fi
          echo "confirmed: $f references no test-hook variable."
        done
