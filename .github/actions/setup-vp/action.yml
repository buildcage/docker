name: Set up vp toolchain
description: Install vp (Vite+), set up Node, and install dependencies
# Callers must run actions/checkout before this: a local-path action can't
# be located at all until the calling job has checked out the repo.

runs:
  using: composite
  steps:
    - name: Set up vp
      uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
      with:
        node-version-file: package.json
        cache: true
        run-install: |
          args: ['--frozen-lockfile']
