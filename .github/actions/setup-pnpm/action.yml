name: Set up pnpm toolchain
description: Enable Corepack, set up Node, and install pnpm dependencies
# Callers must run actions/checkout before this — a local-path action can't
# be located at all until the calling job has checked out the repo.

runs:
  using: composite
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Set up Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: '24'
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
