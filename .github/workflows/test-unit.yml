name: Test / Unit
run-name: Test / Unit (${{ github.ref_name }})

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    name: changes
    if: github.event_name == 'pull_request'
    outputs:
      unit_test: ${{ steps.filter.outputs.unit_test }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # dist/** and action.yml are listed as what unit_test verifies, not
          # as inputs to it: this job holds the only check that the committed
          # bundles match the source.
          filters: |
            unit_test:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'rolldown.config.js'
              - 'rolldown.scripts.config.js'
              - 'tsconfig.json'
              - 'tsconfig.qjs.json'
              - 'vite.config.ts'
              - '.dockerignore'
              - '.github/actions/**'
              - '.github/workflows/test-unit.yml'
              - 'src/**'
              - 'docker/**'
              - 'report/**'
              - 'Makefile'
              - 'dist/**'
              - 'action.yml'

  unit_test:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.unit_test == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "unit: test"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Test buildcage-runc (inspect engine)
        working-directory: docker/inspect/buildcage-runc
        run: go test ./...

      - name: Typecheck
        run: vp run typecheck

      - name: Check (lint/format)
        run: vp check

      - uses: ./.github/actions/verify-dist

      - name: Run unit tests
        run: make test_unit

  # Single, stably-named required status check for branch protection: the
  # matrix-based integration/e2e jobs live in their own workflow files (see
  # test-integration.yml, test-e2e.yml) and can't be added to this `needs`
  # list across files, so branch protection targets one job per file instead.
  unit-tests-passed:
    name: Unit tests passed
    runs-on: ubuntu-latest
    needs: [changes, unit_test]
    if: always()
    permissions: {}
    steps:
      - name: Check whether all required jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
          echo "All required jobs succeeded."
