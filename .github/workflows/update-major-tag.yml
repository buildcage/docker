name: Update major/minor/latest tags

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string

permissions: {}

jobs:
  update-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    # A manual run can move the tags too, so it gets the same approval gate as
    # release.yml; a published release has already been approved by hand.
    environment: ${{ github.event_name == 'workflow_dispatch' && 'release' || '' }}
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Validate tag format
        run: |
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'; then
            echo "::error::Invalid semver format: $TAG (expected vX.Y.Z or vX.Y.Z-prerelease)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Guard against draft and prerelease tags
        id: guard
        env:
          IS_RELEASE_EVENT: ${{ github.event_name == 'release' }}
          EVENT_PRERELEASE: ${{ github.event.release.prerelease }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$IS_RELEASE_EVENT" = "true" ]; then
            IS_PRERELEASE="$EVENT_PRERELEASE"
          else
            # gh release view succeeds for a draft too, so check it explicitly.
            RELEASE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)
            if [ "$(echo "$RELEASE" | jq -r '.isDraft')" != "false" ]; then
              echo "::error::$TAG is still a draft release; publish it before moving major/minor/latest tags"
              exit 1
            fi
            IS_PRERELEASE=$(echo "$RELEASE" | jq -r '.isPrerelease')
          fi
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "::notice::$TAG is a prerelease, so major/minor/latest tags are not updated"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract major version
        id: version
        if: steps.guard.outputs.skip != 'true'
        run: |
          MAJOR="${TAG%%.*}"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: steps.guard.outputs.skip != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Update major/minor/latest git and Docker tags
        if: steps.guard.outputs.skip != 'true'
        env:
          MAJOR: ${{ steps.version.outputs.major }}
          REPO: ghcr.io/${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          MINOR=$(echo "$VERSION" | cut -d. -f1-2)

          TAGS=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags" \
            --jq '.[].ref | ltrimstr("refs/tags/")')

          LATEST_IN_MAJOR=$(echo "$TAGS" | grep -E "^v${MAJOR#v}\.[0-9]+\.[0-9]+$" | sort -V | tail -1)
          LATEST_IN_MINOR=$(echo "$TAGS" | grep -E "^v${MINOR}\.[0-9]+$" | sort -V | tail -1)
          LATEST_OVERALL=$(echo "$TAGS" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)

          for ENGINE in universal inspect; do
            SUFFIX="-${ENGINE}"
            if [ "$TAG" = "$LATEST_IN_MINOR" ]; then
              docker buildx imagetools create --tag "${REPO}:${MINOR}${SUFFIX}" "${REPO}:${VERSION}${SUFFIX}"
            fi
            if [ "$TAG" = "$LATEST_IN_MAJOR" ]; then
              docker buildx imagetools create --tag "${REPO}:${MAJOR#v}${SUFFIX}" "${REPO}:${VERSION}${SUFFIX}"
            fi
            if [ "$TAG" = "$LATEST_OVERALL" ]; then
              docker buildx imagetools create --tag "${REPO}:latest${SUFFIX}" "${REPO}:${VERSION}${SUFFIX}"
            fi
          done

          # Last, so @$MAJOR only moves once every image tag above has.
          if [ "$TAG" = "$LATEST_IN_MAJOR" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
            git tag -fa "$MAJOR" -m "Update $MAJOR to $TAG"
            git push origin "$MAJOR" --force
          fi
