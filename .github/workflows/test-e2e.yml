name: Test / E2E
run-name: Test / E2E (${{ github.ref_name }})

on:
  workflow_dispatch:

  # epic/ branches gather a large change before it lands on main.
  pull_request:
    branches:
      - main
      - "epic/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    name: changes
    if: github.event_name == 'pull_request'
    outputs:
      test_action: ${{ steps.filter.outputs.test_action }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            # Keep in step with what the engine Dockerfiles COPY.
            docker: &docker
              - 'docker/**'
              - 'compose.yaml'
              - 'rolldown.scripts.config.js'
              - '.dockerignore'
              - 'licenses/**'
              - 'LICENSE'
            js-built: &js-built
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'rolldown.config.js'
              - 'tsconfig.json'
              - '.github/actions/setup-vp/**'
            workflow: &workflow
              - '.github/workflows/test-e2e.yml'

            test_action:
              - *docker
              - *js-built
              - *workflow
              - 'src/**'
              - 'report/**'
              - 'action.yml'
              - '.github/actions/assert-post-cleanup/**'
              - 'test/helpers.sh'
              - 'test/assert-post.sh'
              - 'test/assert-action-audit-summary.sh'
              - 'test/assert-inspect-traffic-artifact.mjs'

  # Exercises the real setup/report actions end-to-end (uses: ./,
  # uses: ./report) against an image built from this branch, no registry
  # involved; see docs/development.md#the-actions-against-an-unpublished-image.
  test_action:
    needs: changes
    # !cancelled() forces this to evaluate when `changes` is skipped (it runs
    # only on pull_request); a skipped need otherwise skips the job unevaluated.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.test_action == 'true') }}
    runs-on: ubuntu-latest
    # Well above a normal run; without a limit a hang holds a runner for six
    # hours.
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Also runs the audit-mode builder below.
          - proxy_engine: universal
            build_engine: universal
          # Also runs the known-blocked-rules builder below, on the default
          # engine.
          - proxy_engine: inspect
            build_engine: inspect

    name: "e2e: test (action, ${{ matrix.proxy_engine }})"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before every setup step, so its post hook runs after theirs.
      - name: Check the setup post hooks remove every builder
        uses: ./.github/actions/assert-post-cleanup
        with:
          record: ${{ runner.temp }}/buildcage-builders

      - uses: ./.github/actions/setup-vp

      - name: Build local buildcage image
        env:
          PROXY_ENGINE: ${{ matrix.build_engine }}
        run: docker compose build builder

      - name: Resolve local image ref
        id: local_image
        run: echo "ref=$(docker compose config --images builder)" >> "$GITHUB_OUTPUT"

      - name: Rebuild the actions with the test hooks enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: vp run build

      # allowed-url-rules is newline-separated, which a ${{ }} ternary can't
      # carry reliably, so it's built here instead. *, not **, so each rule
      # only matches its one path shape (package metadata / tarball) rather
      # than falling back to matching any path under the host.
      #
      # A scoped package needs its own pair: `*` does not cross a `/`, and
      # `@hono/node-server` puts a second segment where the unscoped shape has
      # one, both in the metadata path and before the `/-/` in the tarball.
      - name: Choose allowed-url-rules for this engine
        id: url_rules
        run: |
          if [ "${{ matrix.proxy_engine }}" = "inspect" ]; then
            {
              echo "value<<EOF"
              echo "GET|HEAD https://registry.npmjs.org/*"
              echo "GET|HEAD https://registry.npmjs.org/*/-/*"
              echo "GET|HEAD https://registry.npmjs.org/@*/*"
              echo "GET|HEAD https://registry.npmjs.org/@*/*/-/*"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      # Default builder-name is fine: each matrix entry runs on its own VM.
      - name: Start Buildcage builder via the real setup action
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
        with:
          proxy-mode: restrict
          proxy-engine: ${{ matrix.proxy_engine }}
          # inspect uses allowed-url-rules instead, so a host-level rule here
          # wouldn't prove method/path enforcement actually happened.
          allowed-https-rules: ${{ matrix.proxy_engine != 'inspect' && 'registry.npmjs.org:443' || '' }}
          # inspect only; empty is a no-op otherwise.
          allowed-tls-rules: ${{ matrix.proxy_engine == 'inspect' && 'github.com:443' || '' }}
          allowed-url-rules: ${{ steps.url_rules.outputs.value }}

      # Right after each setup step, so a later failure or a timeout still
      # leaves the check above something to check.
      - name: Record the builder for the post hook check
        if: ${{ !cancelled() }}
        run: .github/actions/assert-post-cleanup/record.sh "$RUNNER_TEMP/buildcage-builders"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: remote
          # Matches DEFAULT_BUILDER_NAME in src/report/report-source.ts; update together.
          endpoint: docker-container://buildcage

      - name: Create test Dockerfile
        run: |
          mkdir -p /tmp/build-context
          cat <<'EOF' > /tmp/build-context/Dockerfile
          FROM node:24-alpine
          WORKDIR /app
          # universal does not MITM TLS; inspect terminates it but needs nothing
          # here, because its runc wrapper points NODE_EXTRA_CA_CERTS at the
          # proxy CA.
          RUN npm init -y && npm install --ignore-scripts --no-audit @hono/node-server@2.1.1
          # Blocked by the rules above, so the report shows the full URL, not
          # just the host. Engines differ in exactly how the block shows up
          # (a proxy-level HTTP error under inspect, a rejected connection
          # under universal), so only success here is unexpected.
          RUN if wget -q -O /dev/null --timeout=5 https://example.com/some/path; then \
                echo "FAILED: example.com should have been blocked" && exit 1; \
              fi
          EOF

      - name: Add a TLS passthrough request to the test Dockerfile
        if: matrix.proxy_engine == 'inspect'
        run: |
          cat <<'EOF' >> /tmp/build-context/Dockerfile
          RUN wget -q -O /dev/null https://github.com/
          EOF

      # allowed-url-rules only permits GET|HEAD, so a POST proves the rule is
      # enforced by method, not just by host.
      - name: Add a method-blocked request to the test Dockerfile
        if: matrix.proxy_engine == 'inspect'
        run: |
          cat <<'EOF' >> /tmp/build-context/Dockerfile
          RUN if wget -q -O /dev/null --post-data='' https://registry.npmjs.org/some-path; then \
                echo "FAILED: POST to registry.npmjs.org should have been blocked" && exit 1; \
              fi
          EOF

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: /tmp/build-context
          push: false
          no-cache: true

      - name: Show proxy report
        if: always()
        uses: ./report
        with:
          fail-on-blocked: false
          # Uploaded for inspect only, whose rows the checks below read; a short
          # retention keeps this e2e run's own artifacts from lingering.
          upload-traffic-artifact: ${{ matrix.proxy_engine == 'inspect' }}
          traffic-artifact-retention-days: ${{ matrix.proxy_engine == 'inspect' && '1' || '' }}

      # GITHUB_STEP_SUMMARY is a separate file per step, so a later step can't
      # read what an earlier one wrote there. This downloads the artifact the
      # report step above just uploaded instead. inspect only: the checks read
      # the method and the URL, which universal never sees.
      - name: Download the traffic artifact
        if: matrix.proxy_engine == 'inspect'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: buildcage-traffic
          path: /tmp/buildcage-traffic

      - name: Verify the traffic artifact
        if: matrix.proxy_engine == 'inspect'
        run: node test/assert-inspect-traffic-artifact.mjs /tmp/buildcage-traffic/traffic.json

      # known-blocked-rules is a setup input, so it has to be named when the
      # builder starts, and the report above turns fail-on-blocked off. Here
      # fail-on-blocked stays at its default and the step has to pass anyway,
      # which is what the input is for. The inputs come from config-file, whose
      # builder-name the report has to read back to find the builder.
      - name: Write the known-blocked-rules config file
        if: matrix.proxy_engine == 'inspect'
        run: |
          mkdir -p e2e-config
          cat > e2e-config/buildcage.yml <<'YAML'
          builder-name: buildcage-from-file
          proxy-mode: restrict
          allowed-https-rules: |
            registry.npmjs.org:443
          known-blocked-rules: |
            example.com:443
          YAML

      - name: Start the known-blocked-rules builder from the config file
        if: matrix.proxy_engine == 'inspect'
        id: from_file
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
        with:
          config-file: e2e-config/buildcage.yml

      - name: Record the builder for the post hook check
        if: ${{ !cancelled() && matrix.proxy_engine == 'inspect' }}
        run: .github/actions/assert-post-cleanup/record.sh "$RUNNER_TEMP/buildcage-builders"

      - name: Verify both builder name outputs are the one the config file sets
        if: matrix.proxy_engine == 'inspect'
        env:
          BUILDER_NAME: ${{ steps.from_file.outputs.builder-name }}
          LEGACY_BUILDER_NAME: ${{ steps.from_file.outputs.builder_name }}
        run: |
          test "$BUILDER_NAME" = buildcage-from-file ||
            { echo "::error::builder-name output is '$BUILDER_NAME'"; exit 1; }
          test "$LEGACY_BUILDER_NAME" = buildcage-from-file ||
            { echo "::error::builder_name output is '$LEGACY_BUILDER_NAME'"; exit 1; }

      - name: Set up Docker Buildx for the known-blocked-rules builder
        if: matrix.proxy_engine == 'inspect'
        id: buildx_from_file
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: remote
          endpoint: docker-container://${{ steps.from_file.outputs.builder-name }}

      - name: Create the known-blocked-rules test Dockerfile
        if: matrix.proxy_engine == 'inspect'
        run: |
          mkdir -p /tmp/known-blocked-context
          cat <<'EOF' > /tmp/known-blocked-context/Dockerfile
          FROM node:24-alpine
          # One ordinary allowed request, so the report has both kinds to judge.
          RUN wget -q -O /dev/null --timeout=10 https://registry.npmjs.org/
          # The only blocked connection, and the one known-blocked-rules names.
          # The build fails if it is not blocked, so the report step below
          # cannot pass on a build that never had anything blocked.
          RUN if wget -q -O /dev/null --timeout=5 https://example.com/; then \
                echo "FAILED: example.com should have been blocked" && exit 1; \
              fi
          EOF

      - name: Build the known-blocked-rules test image
        if: matrix.proxy_engine == 'inspect'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          builder: ${{ steps.buildx_from_file.outputs.name }}
          context: /tmp/known-blocked-context
          push: false
          no-cache: true

      # fail-on-blocked left at its default (true). The step must still pass:
      # every blocked connection matched known-blocked-rules.
      - name: Show the known-blocked-rules proxy report
        if: matrix.proxy_engine == 'inspect'
        uses: ./report
        with:
          config-file: e2e-config/buildcage.yml

      # Audit mode's Job Summary carries the restrict-mode example a user
      # copies, which nothing else here renders through the real actions.
      # These two steps keep the inputs' underscore spellings, still accepted.
      - name: Start the audit-mode builder
        if: matrix.proxy_engine == 'universal'
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
        with:
          builder_name: buildcage-audit
          proxy_mode: audit
          proxy_engine: universal

      - name: Record the builder for the post hook check
        if: ${{ !cancelled() && matrix.proxy_engine == 'universal' }}
        run: .github/actions/assert-post-cleanup/record.sh "$RUNNER_TEMP/buildcage-builders"

      - name: Set up Docker Buildx for the audit-mode builder
        if: matrix.proxy_engine == 'universal'
        id: buildx_audit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: remote
          endpoint: docker-container://buildcage-audit

      - name: Create the audit-mode test Dockerfile
        if: matrix.proxy_engine == 'universal'
        run: |
          mkdir -p /tmp/audit-context
          cat <<'EOF' > /tmp/audit-context/Dockerfile
          FROM node:24-alpine
          RUN wget -q -O /dev/null --timeout=10 https://registry.npmjs.org/
          RUN wget -q -O /dev/null --timeout=10 http://example.com/
          EOF

      - name: Build the audit-mode test image
        if: matrix.proxy_engine == 'universal'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          builder: ${{ steps.buildx_audit.outputs.name }}
          context: /tmp/audit-context
          push: false
          no-cache: true

      - name: Show the audit-mode proxy report
        if: matrix.proxy_engine == 'universal'
        uses: ./report
        env:
          BUILDCAGE_TEST_SUMMARY_FILE: ${{ runner.temp }}/audit-summary.md
        with:
          builder_name: buildcage-audit

      - name: Verify the audit-mode Job Summary
        if: matrix.proxy_engine == 'universal'
        env:
          BUILDCAGE_TEST_SUMMARY_FILE: ${{ runner.temp }}/audit-summary.md
        run: ./test/assert-action-audit-summary.sh

  # Single, stably-named required status check for branch protection: the
  # jobs above vary their own names by matrix entry (e2e: test (action,
  # universal), etc.), so branch protection can't target them directly
  # without listing every combination.
  e2e-tests-passed:
    name: E2E tests passed
    runs-on: ubuntu-slim
    timeout-minutes: 5
    needs: [changes, test_action]
    if: always()
    permissions: {}
    steps:
      - name: Check whether all required jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
          echo "All required jobs succeeded."
