name: Test / E2E
run-name: Test / E2E (${{ github.ref_name }})

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    name: changes
    if: github.event_name == 'pull_request'
    outputs:
      test_action: ${{ steps.filter.outputs.test_action }}
      test_sandbox: ${{ steps.filter.outputs.test_sandbox }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            docker: &docker
              - 'core/**'
              - 'setup/docker/**'
              - 'run/docker/**'
              - 'compose.yaml'
            js-built: &js-built
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'rollup.config.js'
              - '.github/actions/setup-pnpm/**'
            workflow: &workflow
              - '.github/workflows/test-e2e.yml'

            test_action:
              - *docker
              - *js-built
              - *workflow
              - 'setup/**'
              - 'report/**'
            test_sandbox:
              - *docker
              - *js-built
              - *workflow
              - 'run/**'

  # Exercises the real setup/report actions end-to-end (uses: ./setup,
  # uses: ./report) against an image built from this branch, no registry
  # involved — see docs/development.md#local-development.
  test_action:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test_action == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        proxy_engine: [transparent, explicit]

    name: "e2e: test (action, ${{ matrix.proxy_engine }})"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Build local buildcage image
        env:
          PROXY_ENGINE: ${{ matrix.proxy_engine }}
        run: docker compose build builder

      - name: Resolve local image ref
        id: local_image
        # Scoped to the builder service: compose.yaml defines more than one
        # service (see the run action's own test_sandbox job), and
        # `--images` with no service argument emits one line per service,
        # which doesn't fit GITHUB_OUTPUT's single-line key=value format.
        run: echo "ref=$(docker compose config --images builder)" >> "$GITHUB_OUTPUT"

      - name: Rebuild setup action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: pnpm build

      # Default builder_name is fine: each matrix entry runs on its own VM.
      - name: Start Buildcage builder via the real setup action
        uses: ./setup
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
        with:
          proxy_mode: restrict
          proxy_engine: ${{ matrix.proxy_engine }}
          allowed_https_rules: registry.npmjs.org:443

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: remote
          # Matches setup/action.yml's default builder_name — update together.
          endpoint: docker-container://buildcage

      - name: Create test Dockerfile
        run: |
          mkdir -p /tmp/build-context
          cat <<'EOF' > /tmp/build-context/Dockerfile
          FROM node:24-alpine
          WORKDIR /app
          # NODE_USE_SYSTEM_CA=1: required for the explicit engine (always
          # MITMs TLS); harmless for transparent.
          RUN npm init -y && NODE_USE_SYSTEM_CA=1 npm install --ignore-scripts express
          RUN wget -q -O /dev/null --timeout=5 https://example.com/ || true
          EOF

      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: /tmp/build-context
          push: false
          no-cache: true

      - name: Show proxy report
        if: always()
        uses: ./report
        with:
          fail_on_blocked: false

      # No cleanup step: ephemeral runner, and setup's post-hook already
      # stops the container.

  # Exercises the real run action end-to-end (uses: ./run) on the actual
  # runner host — can't be validated inside a nested container (see
  # run/dev/ and docs/development.md).
  #
  # Split into one job per case (test_sandbox_*) so each gets its own Job
  # Summary section and status check. run-isolated.sh's own mechanics
  # (privilege drop, filesystem defaults, writable: variations, concurrent
  # lifecycles) are covered more cheaply in test-integration.yml instead.
  #
  # Verifies audit mode's Job Summary includes the auto-generated
  # restrict-mode example (core/lib/build-example.js), mirroring `report`.
  test_sandbox_audit_mode:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test_sandbox == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "e2e: test (sandbox, audit mode)"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Build local sandbox proxy image
        run: docker compose build proxy

      - name: Resolve local image ref
        id: local_image
        run: echo "ref=$(docker compose config --images proxy)" >> "$GITHUB_OUTPUT"

      - name: Rebuild run action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: pnpm build

      - name: Run an isolated command in audit mode
        uses: ./run
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-audit-summary.md
        with:
          proxy_mode: audit
          run: |
            wget -q -T 5 -O /dev/null http://example.com/
            wget -q -T 5 -O /dev/null https://example.com/

      - name: Verify the audit-mode report includes a restrict-mode example
        env:
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-audit-summary.md
        run: ./run/test/assert-sandbox-audit.sh

      # No cleanup step: run stops its own proxy container in its finally block.

  test_sandbox_enforcement:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test_sandbox == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "e2e: test (sandbox, enforcement)"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Build local sandbox proxy image
        run: docker compose build proxy

      - name: Resolve local image ref
        id: local_image
        run: echo "ref=$(docker compose config --images proxy)" >> "$GITHUB_OUTPUT"

      - name: Rebuild run action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: pnpm build

      - name: Run an isolated command via the real run action
        uses: ./run
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
          # A later step can't read this step's GITHUB_STEP_SUMMARY back
          # (GitHub ignores attempts to reassign it), so mirror it here too.
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-test-summary.md
        with:
          allowed_https_rules: example.com:443
          allowed_http_rules: example.com:80
          # Blocked connections below are expected, not a failure.
          fail_on_blocked: false
          # One representative writable: pattern through the real action;
          # other writable: values are cheaper to check in test-integration.yml.
          writable: /opt
          run: |
            echo "=== allowlisted HTTP host must be reachable ==="
            wget -q -T 5 -O /dev/null http://example.com/

            echo "=== allowlisted HTTPS host must be reachable ==="
            wget -q -T 5 -O /dev/null https://example.com/

            echo "=== non-allowlisted HTTP host must be blocked (isolation-escape check) ==="
            if wget -q -T 5 -O /dev/null http://neverssl.com/ 2>&1; then
              echo "UNEXPECTED: neverssl.com was reachable"
              exit 1
            fi
            echo "OK: neverssl.com correctly blocked"

            echo "=== non-allowlisted HTTPS host must be blocked ==="
            if wget -q -T 5 -O /dev/null https://example.org/ 2>&1; then
              echo "UNEXPECTED: example.org (HTTPS) was reachable"
              exit 1
            fi
            echo "OK: example.org (HTTPS) correctly blocked"

            echo "=== /opt must be writable when listed under writable: ==="
            touch /opt/.buildcage-writable-test
            rm -f /opt/.buildcage-writable-test

      - name: Verify the sandbox report contains the expected allowed/blocked entries
        if: always()
        env:
          # Same debug-only mirror as the step above, not GITHUB_STEP_SUMMARY.
          BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-test-summary.md
        run: ./run/test/assert-sandbox.sh

      # No cleanup step: run stops its own proxy container in its finally block.

  # fail_on_blocked defaults to true; verify a blocked connection actually
  # fails the step (exit-code logic itself is already unit-tested).
  test_sandbox_fail_on_blocked:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test_sandbox == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "e2e: test (sandbox, fail_on_blocked)"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Build local sandbox proxy image
        run: docker compose build proxy

      - name: Resolve local image ref
        id: local_image
        run: echo "ref=$(docker compose config --images proxy)" >> "$GITHUB_OUTPUT"

      - name: Rebuild run action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: pnpm build

      - name: Run an isolated command that triggers a blocked connection
        id: blocked_connection
        continue-on-error: true
        uses: ./run
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
        with:
          allowed_https_rules: example.com:443
          allowed_http_rules: example.com:80
          # fail_on_blocked intentionally left at its default (true).
          run: wget -q -T 5 -O /dev/null http://neverssl.com/ || true

      - name: Verify fail_on_blocked actually failed the step
        if: always()
        run: |
          if [ "${{ steps.blocked_connection.outcome }}" != "failure" ]; then
            echo "::error::Expected the blocked-connection step to fail (fail_on_blocked defaults to true), but it reported '${{ steps.blocked_connection.outcome }}'"
            exit 1
          fi
          echo "OK: fail_on_blocked correctly failed the step"

      # No cleanup step: run stops its own proxy container in its finally block.

  # Proves container/network/Compose-project namespacing holds under
  # Actions' own `parallel:` keyword; the direct-script counterpart is
  # in test-integration.yml.
  test_sandbox_concurrency:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test_sandbox == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "e2e: test (sandbox, concurrency)"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Build local sandbox proxy image
        run: docker compose build proxy

      - name: Resolve local image ref
        id: local_image
        run: echo "ref=$(docker compose config --images proxy)" >> "$GITHUB_OUTPUT"

      - name: Rebuild run action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: pnpm build

      - parallel:
          - name: sandbox-parallel-a
            id: parallel_a
            uses: ./run
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
              BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-parallel-a-summary.md
            with:
              allowed_https_rules: example.com:443
              allowed_http_rules: example.com:80
              label: parallel-a
              fail_on_blocked: false
              run: |
                sleep 5
                wget -q -T 5 -O /dev/null http://example.com/
                if wget -q -T 5 -O /dev/null http://example.net/ 2>&1; then
                  echo "::error::cross-talk: example.net (step B's allowlist) was reachable from step A"; exit 1
                fi

          - name: sandbox-parallel-b
            id: parallel_b
            uses: ./run
            env:
              BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
              BUILDCAGE_RUN_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-parallel-b-summary.md
            with:
              allowed_https_rules: example.net:443
              allowed_http_rules: example.net:80
              label: parallel-b
              fail_on_blocked: false
              run: |
                wget -q -T 5 -O /dev/null http://example.net/
                if wget -q -T 5 -O /dev/null http://example.com/ 2>&1; then
                  echo "::error::cross-talk: example.com (step A's allowlist) was reachable from step B"; exit 1
                fi

      - name: Verify no leftover buildcage-proxy containers/networks after the parallel steps
        if: always()
        run: |
          LEFTOVER_C=$(docker ps -a --filter "name=buildcage-proxy-" -q)
          LEFTOVER_N=$(docker network ls --filter "name=buildcage-proxy-" -q)
          if [ -n "$LEFTOVER_C" ] || [ -n "$LEFTOVER_N" ]; then
            echo "::error::leftover buildcage-proxy containers/networks found after parallel sandbox steps"
            exit 1
          fi

      # No cleanup step: run stops its own proxy container in its finally block.

  # Single, stably-named required status check for branch protection: the
  # jobs above vary their own names by matrix entry (e2e: test (action,
  # transparent), etc.), so branch protection can't target them directly
  # without listing every combination.
  e2e-tests-passed:
    name: E2E tests passed
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        test_action,
        test_sandbox_audit_mode,
        test_sandbox_enforcement,
        test_sandbox_fail_on_blocked,
        test_sandbox_concurrency,
      ]
    if: always()
    permissions: {}
    steps:
      - name: Check whether all required jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
          echo "All required jobs succeeded."
