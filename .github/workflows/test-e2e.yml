name: Test / E2E
run-name: Test / E2E (${{ github.ref_name }})

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    name: changes
    if: github.event_name == 'pull_request'
    outputs:
      test_action: ${{ steps.filter.outputs.test_action }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            docker: &docker
              - 'core/**'
              - 'setup/docker/**'
              - 'compose.yaml'
            js-built: &js-built
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'rolldown.config.js'
              - 'tsconfig.json'
              - '.github/actions/setup-vp/**'
            workflow: &workflow
              - '.github/workflows/test-e2e.yml'

            test_action:
              - *docker
              - *js-built
              - *workflow
              - 'setup/**'
              - 'report/**'

  # Exercises the real setup/report actions end-to-end (uses: ./setup,
  # uses: ./report) against an image built from this branch, no registry
  # involved — see docs/development.md#local-development.
  test_action:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test_action == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        proxy_engine: [transparent, explicit]

    name: "e2e: test (action, ${{ matrix.proxy_engine }})"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - name: Build local buildcage image
        env:
          PROXY_ENGINE: ${{ matrix.proxy_engine }}
        run: docker compose build builder

      - name: Resolve local image ref
        id: local_image
        run: echo "ref=$(docker compose config --images builder)" >> "$GITHUB_OUTPUT"

      - name: Rebuild setup action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: vp run build

      # Default builder_name is fine: each matrix entry runs on its own VM.
      - name: Start Buildcage builder via the real setup action
        uses: ./setup
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
        with:
          proxy_mode: restrict
          proxy_engine: ${{ matrix.proxy_engine }}
          allowed_https_rules: registry.npmjs.org:443

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: remote
          # Matches setup/action.yml's default builder_name — update together.
          endpoint: docker-container://buildcage

      - name: Create test Dockerfile
        run: |
          mkdir -p /tmp/build-context
          cat <<'EOF' > /tmp/build-context/Dockerfile
          FROM node:24-alpine
          WORKDIR /app
          # NODE_USE_SYSTEM_CA=1: required for the explicit engine (always
          # MITMs TLS); harmless for transparent.
          RUN npm init -y && NODE_USE_SYSTEM_CA=1 npm install --ignore-scripts express
          RUN wget -q -O /dev/null --timeout=5 https://example.com/ || true
          EOF

      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: /tmp/build-context
          push: false
          no-cache: true

      - name: Show proxy report
        if: always()
        uses: ./report
        with:
          fail_on_blocked: false

      # No cleanup step: ephemeral runner, and setup's post-hook already
      # stops the container.

  # Single, stably-named required status check for branch protection: the
  # jobs above vary their own names by matrix entry (e2e: test (action,
  # transparent), etc.), so branch protection can't target them directly
  # without listing every combination.
  e2e-tests-passed:
    name: E2E tests passed
    runs-on: ubuntu-latest
    needs: [changes, test_action]
    if: always()
    permissions: {}
    steps:
      - name: Check whether all required jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
          echo "All required jobs succeeded."
