name: Example (inspect engine, audit mode)

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # inspect decrypts, so it logs each request's method and full URL, and
      # the report's "Switch to restrict mode" section returns allowed_url_rules.
      - name: Start Buildcage builder
        uses: buildcage/docker@b5459229d32c2aad72e4492fac98a192f85f75e0 # v4.0.4
        with:
          proxy_mode: audit
          proxy_engine: inspect

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: remote
          endpoint: docker-container://buildcage

      - name: Create test Dockerfile
        run: |
          mkdir -p /tmp/build-context
          cat <<'EOF' > /tmp/build-context/Dockerfile
          FROM node:24-bookworm-slim
          WORKDIR /app
          # Debian's archive is plain HTTP, so apt's rules are http:// URLs.
          RUN apt-get update && \
              apt-get install -y wget && \
              rm -rf /var/lib/apt/lists/*
          RUN npm init -y && npm install --ignore-scripts @hono/node-server
          EOF

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: /tmp/build-context
          push: false
          no-cache: true

      - name: Show proxy report
        if: always()
        uses: buildcage/docker/report@b5459229d32c2aad72e4492fac98a192f85f75e0 # v4.0.4
