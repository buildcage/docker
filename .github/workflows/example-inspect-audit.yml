name: Example (inspect engine, audit mode)

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # inspect decrypts, so it logs each request's method and full URL, and
      # the report's "Switch to restrict mode" section returns allowed_url_rules.
      - name: Start Buildcage builder
        uses: buildcage/docker@7bdb27a9380c8e2106d9d1222e16f1e5c1fe6264 # v3.1.6-rc2
        with:
          proxy_mode: audit
          proxy_engine: inspect

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: remote
          endpoint: docker-container://buildcage

      - name: Create test Dockerfile
        run: |
          mkdir -p /tmp/build-context
          cat <<'EOF' > /tmp/build-context/Dockerfile
          FROM node:24-bookworm-slim
          WORKDIR /app
          # Debian's archive is plain HTTP, so apt's rules are http:// URLs.
          RUN apt-get update && \
              apt-get install -y --no-install-recommends curl && \
              rm -rf /var/lib/apt/lists/*
          RUN npm init -y && npm install --ignore-scripts express
          # Unneeded by the build; leave it out of the rules you paste back in.
          RUN curl -sS --max-time 5 -o /dev/null https://example.com/ || true
          EOF

      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: /tmp/build-context
          push: false
          no-cache: true

      - name: Show proxy report
        if: always()
        uses: buildcage/docker/report@7bdb27a9380c8e2106d9d1222e16f1e5c1fe6264 # v3.1.6-rc2
