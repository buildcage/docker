name: Example (inspect engine, restrict mode)

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # The audit example's build, with the rules that run produced and one
      # request they block. The rules name methods too, so an npm publish (a
      # PUT) would be blocked as well.
      - name: Start Buildcage builder
        uses: buildcage/docker@0e382c9c236fb24e60ccce9dba512a67b270b8bf # v4.3.0
        with:
          proxy_mode: restrict
          proxy_engine: inspect
          allowed_url_rules: |
            # apt, over plain HTTP
            GET http://deb.debian.org/debian/**
            GET http://deb.debian.org/debian-security/**

            # npm install, plus the audit POST it sends after installing
            GET|HEAD https://registry.npmjs.org/**
            POST https://registry.npmjs.org/-/npm/v1/security/advisories/bulk

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: remote
          endpoint: docker-container://buildcage

      - name: Create test Dockerfile
        run: |
          mkdir -p /tmp/build-context
          cat <<'EOF' > /tmp/build-context/Dockerfile
          FROM node:24-bookworm-slim
          WORKDIR /app
          # Debian's archive is plain HTTP, so apt's rules are http:// URLs.
          RUN apt-get update && \
              apt-get install -y wget && \
              rm -rf /var/lib/apt/lists/*
          RUN npm init -y && npm install --ignore-scripts @hono/node-server
          # Blocked: the report names the full URL, not just the host.
          RUN wget -q -O /dev/null --timeout=5 https://example.com/ || true
          EOF

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: /tmp/build-context
          push: false
          no-cache: true

      # fail_on_blocked is false only because this example blocks on purpose;
      # leave it at its default so a real workflow fails on a disallowed request.
      - name: Show proxy report
        if: always()
        uses: buildcage/docker/report@0e382c9c236fb24e60ccce9dba512a67b270b8bf # v4.3.0
        with:
          fail_on_blocked: false
