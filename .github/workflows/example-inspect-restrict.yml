name: Example (inspect engine, restrict mode)

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Same build as the audit example, with the rules that run produced. npm
      # publish is a PUT, so it's refused: no rule here covers that method.
      - name: Start Buildcage builder
        uses: buildcage/docker@7bdb27a9380c8e2106d9d1222e16f1e5c1fe6264 # v3.1.6-rc2
        with:
          proxy_mode: restrict
          proxy_engine: inspect
          allowed_url_rules: |
            # apt, over plain HTTP
            GET http://deb.debian.org/debian/**
            GET http://deb.debian.org/debian-security/**

            # npm install, plus its post-install audit-endpoint POST
            GET|HEAD https://registry.npmjs.org/**
            POST https://registry.npmjs.org/-/npm/v1/security/advisories/bulk

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: remote
          endpoint: docker-container://buildcage

      - name: Create test Dockerfile
        run: |
          mkdir -p /tmp/build-context
          cat <<'EOF' > /tmp/build-context/Dockerfile
          FROM node:24-bookworm-slim
          WORKDIR /app
          # Debian's archive is plain HTTP, so apt's rules are http:// URLs.
          RUN apt-get update && \
              apt-get install -y --no-install-recommends curl && \
              rm -rf /var/lib/apt/lists/*
          RUN npm init -y && npm install --ignore-scripts express
          # Refused: the report names the full URL, not just the host.
          RUN curl -sS --max-time 5 -o /dev/null https://example.com/ || true
          EOF

      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: /tmp/build-context
          push: false
          no-cache: true

      # fail_on_blocked is false only because this example blocks on purpose;
      # leave it at its default so a real workflow fails on a disallowed request.
      - name: Show proxy report
        if: always()
        uses: buildcage/docker/report@7bdb27a9380c8e2106d9d1222e16f1e5c1fe6264 # v3.1.6-rc2
        with:
          fail_on_blocked: false
