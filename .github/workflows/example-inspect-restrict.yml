name: Example (inspect engine, restrict mode)

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Same build as the audit example, with the rules that run produced.
      # Each rule names the methods it permits, so npm can install a package
      # but not publish one: npm publish is a PUT to the same host, which no
      # rule here covers.
      - name: Start Buildcage builder
        uses: buildcage/docker@806c35dcae3da9f5f5914e7c6086fde53f9cb24a # v3.1.5
        with:
          proxy_mode: restrict
          proxy_engine: inspect
          allowed_url_rules: |
            # apt, over plain HTTP. bookworm-slim's default sources span both
            # of these path prefixes.
            GET http://deb.debian.org/debian/**
            GET http://deb.debian.org/debian-security/**

            # npm: package metadata and tarballs, plus the one POST npm makes
            # to the audit endpoint after an install.
            GET|HEAD https://registry.npmjs.org/**
            POST https://registry.npmjs.org/-/npm/v1/security/advisories/bulk

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: remote
          endpoint: docker-container://buildcage

      - name: Create test Dockerfile
        run: |
          mkdir -p /tmp/build-context
          cat <<'EOF' > /tmp/build-context/Dockerfile
          FROM node:24-bookworm-slim
          WORKDIR /app
          # The Debian archive is plain HTTP by default, so apt's rules are
          # http:// URLs.
          RUN apt-get update && \
              apt-get install -y --no-install-recommends curl && \
              rm -rf /var/lib/apt/lists/*
          RUN npm init -y && npm install --ignore-scripts express
          # No rule covers it, so the report names the full URL that was
          # refused, not just the host.
          RUN curl -sS --max-time 5 -o /dev/null https://example.com/ || true
          EOF

      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: /tmp/build-context
          push: false
          no-cache: true

      # fail_on_blocked is false only because this example blocks something on
      # purpose. Leave it at its default so a real workflow fails on a request
      # it did not allow.
      - name: Show proxy report
        if: always()
        uses: buildcage/docker/report@806c35dcae3da9f5f5914e7c6086fde53f9cb24a # v3.1.5
        with:
          fail_on_blocked: false
