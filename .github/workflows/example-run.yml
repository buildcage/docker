name: Example (run action)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Only needed for self-hosting under a private GHCR package; the public
      # dash14/buildcage image is pulled anonymously and needs no login.
      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests with outbound network isolation
        # For self-hosting, replace with: <your-org>/buildcage/run@<SHA>
        uses: dash14/buildcage/run@39444cc894f62cc065d088f4a07821179d560f5e # v2.2.3
        with:
          proxy_mode: restrict
          allowed_https_rules: >-
            registry.npmjs.org:443
          # This step intentionally triggers a blocked connection below to
          # demonstrate enforcement — that's expected, not a failure.
          fail_on_blocked: false
          run: |
            npm init -y
            npm install --ignore-scripts express

            echo "=== allowlisted host must be reachable ==="
            npm ping

            echo "=== non-allowlisted host must be blocked ==="
            wget -q -O /dev/null --timeout=5 https://example.com/ || true
