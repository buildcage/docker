name: Example (universal engine, restrict mode)

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Same build as the audit example, with the rules that run produced.
      # The universal engine enforces on host and port, which is as far as it
      # can see without decrypting, and is all a JVM build can be given: Maven
      # reads the JVM's own cacerts store, so an injected CA would not be
      # trusted.
      - name: Start Buildcage builder
        uses: buildcage/docker@806c35dcae3da9f5f5914e7c6086fde53f9cb24a # v3.1.5
        with:
          proxy_mode: restrict
          proxy_engine: universal
          allowed_https_rules: |
            repo.maven.apache.org:443

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: remote
          endpoint: docker-container://buildcage

      - name: Create test Dockerfile
        run: |
          mkdir -p /tmp/build-context
          cat <<'EOF' > /tmp/build-context/Dockerfile
          FROM maven:3-eclipse-temurin-21-alpine
          WORKDIR /app
          RUN mvn -B dependency:get -Dartifact=org.apache.commons:commons-lang3:3.17.0
          # Not on the allowlist, so the report shows it as a blocked host.
          RUN wget -q -O /dev/null --timeout=5 https://example.com/ || true
          EOF

      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: /tmp/build-context
          push: false
          no-cache: true

      # fail_on_blocked is false only because this example blocks something on
      # purpose. Leave it at its default so a real workflow fails on a
      # destination it did not allow.
      - name: Show proxy report
        if: always()
        uses: buildcage/docker/report@806c35dcae3da9f5f5914e7c6086fde53f9cb24a # v3.1.5
        with:
          fail_on_blocked: false
