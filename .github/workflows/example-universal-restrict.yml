name: Example (universal engine, restrict mode)

on:
  workflow_dispatch:

  # Renovate moves the pin below to each new release, so that pull request
  # runs the release through the same path a user's workflow takes: the image
  # pulled by tag and its signature verified.
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/example-universal-restrict.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Renovate sees the release's tag as soon as it is pushed, while
  # docker-publish.yml is still building and signing that tag's images, and
  # the example would fail on an image that is not signed yet.
  release_image:
    runs-on: ubuntu-slim
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Wait for the pinned release's images
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/wait-for-release-image
        with:
          workflow: .github/workflows/example-universal-restrict.yml

  build:
    needs: release_image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      # The audit example's build, with the rules that run produced and one
      # request they block. universal enforces on host and port only, which is
      # as far as it can see without decrypting.
      - name: Start Buildcage builder
        uses: buildcage/docker@ef2b79a3baaddc6a69c1b10a2c473a134ece2eca # v4.4.0
        with:
          proxy-mode: restrict
          proxy-engine: universal
          allowed-https-rules: |
            repo.maven.apache.org:443
            repository.apache.org:443

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: remote
          endpoint: docker-container://buildcage

      - name: Create test Dockerfile
        run: |
          mkdir -p /tmp/build-context
          cat <<'EOF' > /tmp/build-context/Dockerfile
          FROM maven:3-eclipse-temurin-21-alpine
          WORKDIR /app
          RUN mvn -B dependency:get -Dartifact=org.apache.commons:commons-lang3:3.17.0
          # Not on the allowlist, so the report shows it as a blocked host.
          RUN wget -q -O /dev/null --timeout=5 https://example.com/ || true
          EOF

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: /tmp/build-context
          push: false
          no-cache: true

      # fail-on-blocked is false only because this example blocks on purpose;
      # leave it at its default so a real workflow fails on a disallowed destination.
      - name: Show proxy report
        if: always()
        uses: buildcage/docker/report@ef2b79a3baaddc6a69c1b10a2c473a134ece2eca # v4.4.0
        with:
          fail-on-blocked: false
