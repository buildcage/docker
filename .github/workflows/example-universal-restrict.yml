name: Example (universal engine, restrict mode)

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Same build as the audit example, with the rules that run produced.
      # universal enforces on host and port only, which is as far as it can see
      # without decrypting, and all a JVM build like this one can accept.
      - name: Start Buildcage builder
        uses: buildcage/docker@b5459229d32c2aad72e4492fac98a192f85f75e0 # v4.0.4
        with:
          proxy_mode: restrict
          proxy_engine: universal
          allowed_https_rules: |
            repo.maven.apache.org:443

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: remote
          endpoint: docker-container://buildcage

      - name: Create test Dockerfile
        run: |
          mkdir -p /tmp/build-context
          cat <<'EOF' > /tmp/build-context/Dockerfile
          FROM maven:3-eclipse-temurin-21-alpine
          WORKDIR /app
          RUN mvn -B dependency:get -Dartifact=org.apache.commons:commons-lang3:3.17.0
          # Not on the allowlist, so the report shows it as a blocked host.
          RUN wget -q -O /dev/null --timeout=5 https://example.com/ || true
          EOF

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: /tmp/build-context
          push: false
          no-cache: true

      # fail_on_blocked is false only because this example blocks on purpose;
      # leave it at its default so a real workflow fails on a disallowed destination.
      - name: Show proxy report
        if: always()
        uses: buildcage/docker/report@b5459229d32c2aad72e4492fac98a192f85f75e0 # v4.0.4
        with:
          fail_on_blocked: false
