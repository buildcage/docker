name: Build and Push Docker Image
run-name: Build and Push Docker Image (${{ github.ref_name }})

on:
  push:
    tags:
      - "v*.*.*"

  # No inputs: a manual rebuild must be dispatched with the release tag selected
  # as the ref, so the image's Sigstore identity names the tag it rebuilds.
  workflow_dispatch:

concurrency:
  group: docker-publish
  cancel-in-progress: false

permissions: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: universal
            dockerfile: docker/universal/Dockerfile
          - engine: inspect
            dockerfile: docker/inspect/Dockerfile
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      # Matrix legs sharing one output name would clobber each other (last
      # completed leg wins), so each leg instead writes to a step-output key
      # suffixed with its own matrix.engine value, which keeps the two from
      # colliding and carries each one into this job's own (statically-declared)
      # outputs.
      digest-universal: ${{ steps.digest.outputs['universal'] }}
      digest-inspect: ${{ steps.digest.outputs['inspect'] }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # The signing job takes the image's Sigstore identity (SAN ref, OID
          # 1.13 source sha) from the ref this run was started on, so it must be
          # the release tag being built. Require a semver tag ref (as release.yml
          # does), which also rejects a workflow_dispatch started on a branch.
          if ! printf '%s' "$GITHUB_REF" |
            grep -qE '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'; then
            echo "::error::This workflow must run on a semver release tag (vX.Y.Z or vX.Y.Z-prerelease); github.ref is $GITHUB_REF. For a manual rebuild, dispatch it with the release tag selected as the ref."
            exit 1
          fi
          echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Start Buildcage builder
        uses: buildcage/docker@50b861fa913fd9c701b0062526494a182b2e8882 # v4.0.1
        with:
          proxy_mode: restrict
          proxy_engine: inspect
          allowed_url_rules: |
            # apk package index and packages (haproxy, curl, gettext, ...)
            GET https://dl-cdn.alpinelinux.org/alpine/**

            # CNI plugins and CoreDNS release binaries (github 302-redirects here)
            GET https://github.com/containernetworking/plugins/releases/download/**
            GET https://github.com/coredns/coredns/releases/download/**
            GET https://release-assets.githubusercontent.com/**

            # Node.js runtime for the QuickJS scripts build stage
            GET https://nodejs.org/download/release/**

            # npm registry: dev deps bundled into the qjs scripts
            GET|HEAD https://registry.npmjs.org/**

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: remote
          endpoint: docker-container://buildcage

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Every engine publishes under its own -<engine> suffix, so no image
          # tag is ever engine-ambiguous.
          # "latest" is applied later, by update-major-tag.yml on release publish.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }},suffix=-${{ matrix.engine }}
            type=raw,value=sha-${{ steps.version.outputs.sha }}-${{ matrix.engine }},priority=100

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_CHECKS_ANNOTATIONS: true
          DOCKER_BUILD_SUMMARY: true
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Show proxy report
        if: always()
        uses: buildcage/docker/report@50b861fa913fd9c701b0062526494a182b2e8882 # v4.0.1
        with:
          fail_on_blocked: true

      - name: Record the digest under this engine's own key
        id: digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ENGINE: ${{ matrix.engine }}
        run: echo "${ENGINE}=${DIGEST}" >> "$GITHUB_OUTPUT"

  # Gates signing on the pushed image actually building. A release build resolves
  # its packages and base image again, so a green PR says nothing about what this
  # tag carries; signing only what has built keeps a broken image unusable, since
  # the setup action refuses an unsigned one.
  #
  # Real hosts, not the fixtures: trusting their self-signed certificate takes a
  # BUILDCAGE_TEST_HOOKS build, which a released image deliberately is not.
  verify-image:
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # Natively on both: QEMU would put buildkitd, the s6 tree and iptables
        # through a layer the released image never runs under.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        engine: [universal, inspect]
    runs-on: ${{ matrix.runner }}
    name: "verify (${{ matrix.engine }}, ${{ matrix.runner }})"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag this run built, which is the ref the run was started on.
          ref: ${{ needs.build-and-push.outputs.tag }}
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve this engine's image ref
        id: image
        env:
          OUTPUTS: ${{ toJSON(needs.build-and-push.outputs) }}
          ENGINE: ${{ matrix.engine }}
          REPO: ${{ github.repository }}
        run: |
          DIGEST=$(jq -er --arg e "$ENGINE" '.["digest-" + $e]' <<< "$OUTPUTS")
          echo "ref=ghcr.io/${REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"

      # The override starts the builder with --pull never, so the image has to
      # be here first.
      - name: Pull the image that was just pushed
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: docker pull "$IMAGE_REF"

      # The image is not signed yet, so the action's provenance path cannot
      # resolve it and this hook is the only way to name a ref. Never committed.
      - name: Rebuild setup action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: vp run build

      - name: Start Buildcage builder via the real setup action
        uses: ./
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.image.outputs.ref }}
        with:
          proxy_mode: restrict
          proxy_engine: ${{ matrix.engine }}
          # Each engine gets the rule kind it actually enforces on.
          allowed_https_rules: ${{ matrix.engine == 'universal' && 'example.com:443' || '' }}
          allowed_url_rules: ${{ matrix.engine == 'inspect' && 'GET|HEAD https://example.com/**' || '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: remote
          # Matches action.yml's default builder_name; update together.
          endpoint: docker-container://buildcage

      # alpine for busybox wget alone: buildkitd fetches FROM off the isolated
      # network, so the base image needs no rule of its own.
      - name: Create test Dockerfile
        run: |
          mkdir -p /tmp/build-context
          cat <<'EOF' > /tmp/build-context/Dockerfile
          FROM alpine:3
          # Retried because a release should not go unsigned over one bad
          # minute at the origin. No --no-check-certificate: under inspect the
          # proxy terminates TLS, so this also proves buildcage-runc gave the
          # step its CA.
          RUN for attempt in 1 2 3; do \
                wget -q -T 15 -O /dev/null https://example.com/ && break; \
                [ "$attempt" = 3 ] && exit 1; \
                sleep 5; \
              done
          RUN if wget -q -T 15 -O /dev/null https://neverssl.com/; then \
                echo "FAILED: neverssl.com should have been refused" && exit 1; \
              fi
          EOF

      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: /tmp/build-context
          push: false
          no-cache: true

      # The build only sees that the second request failed, which an outage
      # would produce too. fail_on_blocked stays at its default so that the
      # report finding the refusal is what the next step asserts on, and
      # producing it exercises the image's own report-action.js.
      - name: Show proxy report
        id: report
        if: always()
        continue-on-error: true
        uses: ./report

      - name: The report must have recorded the refusal
        env:
          REPORT_OUTCOME: ${{ steps.report.outcome }}
        run: |
          if [ "$REPORT_OUTCOME" != "failure" ]; then
            echo "::error::no blocked connection reached the report"
            exit 1
          fi

      # No cleanup step: ephemeral runner, and setup's post-hook already
      # stops the container.

  sign-and-attest:
    needs: [build-and-push, verify-image]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        engine: [universal, inspect]
    name: "sign (${{ matrix.engine }})"
    outputs:
      # Same reason as build-and-push's own per-engine output keys above.
      bundle-content-universal: ${{ steps.bundle.outputs['content-universal'] }}
      bundle-content-inspect: ${{ steps.bundle.outputs['content-inspect'] }}

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve this engine's digest
        id: digest
        env:
          OUTPUTS: ${{ toJSON(needs.build-and-push.outputs) }}
          ENGINE: ${{ matrix.engine }}
        run: |
          DIGEST=$(jq -er --arg e "$ENGINE" '.["digest-" + $e]' <<< "$OUTPUTS")
          echo "value=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Sign Docker image
        env:
          DIGEST: ${{ steps.digest.outputs.value }}
          REPO: ${{ github.repository }}
        run: |
          cosign sign --yes --new-bundle-format ghcr.io/${REPO}@${DIGEST}

      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true

      - name: Read bundle content
        id: bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          ENGINE: ${{ matrix.engine }}
        run: |
          echo "content-${ENGINE}<<EOF" >> "$GITHUB_OUTPUT"
          cat "$BUNDLE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  upload-release-assets:
    needs: [build-and-push, sign-and-attest]
    runs-on: ubuntu-slim
    permissions:
      contents: write

    steps:
      - name: Check release
        id: check
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft 2>&1) || {
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$(echo "$RELEASE" | jq -r '.isDraft')" != "true" ]; then
            echo "::warning::Release $TAG is already published, skipping upload"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "upload=true" >> "$GITHUB_OUTPUT"

      - name: Upload to Release
        if: steps.check.outputs.upload == 'true'
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
          BUNDLE_UNIVERSAL: ${{ needs.sign-and-attest.outputs['bundle-content-universal'] }}
          BUNDLE_INSPECT: ${{ needs.sign-and-attest.outputs['bundle-content-inspect'] }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$BUNDLE_UNIVERSAL" > buildcage-container-universal.sigstore.json
          echo "$BUNDLE_INSPECT" > buildcage-container-inspect.sigstore.json
          gh release upload --repo "$GITHUB_REPOSITORY" "$TAG" \
            buildcage-container-universal.sigstore.json \
            buildcage-container-inspect.sigstore.json
