name: Image Security Scan
run-name: Image Security Scan (${{ github.ref_name }})

on:
  schedule:
    # Monthly on the 1st at 00:00 UTC
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: universal
            dockerfile: docker/universal/Dockerfile
          - engine: inspect
            dockerfile: docker/inspect/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: buildcage-${{ matrix.engine }}:scan

      - name: Scan image with Trivy
        if: github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: buildcage-${{ matrix.engine }}:scan
          ignore-unfixed: true
          trivyignores: .trivyignore
          scanners: vuln
          format: sarif
          output: trivy-results-${{ matrix.engine }}.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results to GitHub Security
        if: github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-results-${{ matrix.engine }}.sarif
          category: ${{ matrix.engine }}

      - name: Scan image with Trivy
        if: github.ref != 'refs/heads/main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: buildcage-${{ matrix.engine }}:scan
          ignore-unfixed: true
          trivyignores: .trivyignore
          scanners: vuln
          format: table
