name: Example (run action, restrict mode)

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # packages: read # Uncomment together with the login step below when self-hosting under a private GHCR package.

    steps:
      # Uncomment when self-hosting under a private GHCR package; the public
      # dash14/buildcage image is pulled anonymously and needs no login.
      # - name: Login to GHCR
      #   uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests with outbound network isolation
        # For self-hosting, replace with: <your-org>/buildcage/run@<SHA>
        uses: dash14/buildcage/run@bdf40b4677db602b923c622f26ef09a210d2ebd7 # v2.2.4
        with:
          proxy_mode: restrict
          allowed_https_rules: |
            registry.npmjs.org:443
          # This step intentionally triggers a blocked connection below to
          # demonstrate enforcement — that's expected, not a failure.
          fail_on_blocked: false
          run: |
            npm init -y
            npm install --ignore-scripts express

            echo "=== allowlisted host must be reachable ==="
            npm ping

            echo "=== non-allowlisted host must be blocked ==="
            wget -q -O /dev/null --timeout=5 https://example.com/ || true
