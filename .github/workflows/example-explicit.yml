name: Example (explicit engine)

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Start Buildcage builder
        uses: buildcage/docker@d6f130e3476121607affc037e1c56fafb48ea897 # v3.2.1
        with:
          proxy_mode: restrict
          proxy_engine: explicit
          allowed_https_rules: |
            registry.npmjs.org:443
            fonts.googleapis.com:443

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: remote
          endpoint: docker-container://buildcage

      - name: Create test Dockerfile
        run: |
          mkdir -p /tmp/build-context
          cat <<'EOF' > /tmp/build-context/Dockerfile
          FROM node:24-alpine
          WORKDIR /app
          RUN npm init -y
          # npm bundles its own CA store, so it needs NODE_USE_SYSTEM_CA=1 to trust the proxy CA.
          RUN NODE_USE_SYSTEM_CA=1 npm install --ignore-scripts @hono/node-server
          RUN wget -q -O /dev/null --timeout=5 https://example.com/ || true
          EOF

      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: /tmp/build-context
          push: false
          no-cache: true

      # fail_on_blocked is false only because this example blocks on purpose;
      # leave it at its default so a real workflow fails on a disallowed destination.
      - name: Show proxy report
        if: always()
        uses: buildcage/docker/report@d6f130e3476121607affc037e1c56fafb48ea897 # v3.2.1
        with:
          fail_on_blocked: false
