name: Test
run-name: Test (${{ github.ref_name }})

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    name: changes
    if: github.event_name == 'pull_request'
    outputs:
      unit_test: ${{ steps.filter.outputs.unit_test }}
      test: ${{ steps.filter.outputs.test }}
      test_multiarch: ${{ steps.filter.outputs.test_multiarch }}
      test_action: ${{ steps.filter.outputs.test_action }}
      test_sandbox: ${{ steps.filter.outputs.test_sandbox }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            docker: &docker
              - 'docker/**'
              - 'compose.yaml'
            js-built: &js-built
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'rollup.config.js'
              - '.github/actions/setup-pnpm/**'
            workflow: &workflow
              - '.github/workflows/test.yml'

            unit_test:
              - *js-built
              - *workflow
              - 'docker/transparent/**'
              - 'docker/explicit/**'
              - 'docker/sandbox/**'
              - 'docker/tools/**'
              - 'setup/**'
              - 'report/**'
              - 'sandbox/**'
              - 'Makefile'
            test:
              - *docker
              - *workflow
              - 'compose.test-transparent.yaml'
              - 'compose.test-explicit.yaml'
              - 'test/**'
              - 'report/src/**'
            test_multiarch:
              - *docker
              - *workflow
              - 'test/Dockerfile.multiarch'
            test_action:
              - *docker
              - *js-built
              - *workflow
              - 'setup/**'
              - 'report/**'
            test_sandbox:
              - *docker
              - *js-built
              - *workflow
              - 'sandbox/**'
              - 'test/assert-sandbox.sh'

  unit_test:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.unit_test == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: test (unit)
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Build
        run: pnpm build

      - name: Check dist is up to date
        run: git diff --exit-code

      - name: Check dist is free of the local-image test hook
        run: |
          for f in setup/dist/main.cjs sandbox/dist/main.cjs; do
            if grep -q 'process\.env\.BUILDCAGE_BUILD_TEST_HOOKS' "$f"; then
              echo "::error::$f still contains a live process.env.BUILDCAGE_BUILD_TEST_HOOKS read after a normal build — @rollup/plugin-replace failed to substitute it (see rollup.config.js). This means the local-image bypass could be reachable by anyone setting that env var on a published action step. Do not merge until this passes."
              exit 1
            fi
            echo "confirmed: $f has no live BUILDCAGE_BUILD_TEST_HOOKS read — the local-image bypass is unreachable in this build."
          done

      - name: Run unit tests
        run: make test_unit

  test:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: transparent-audit
            proxy_mode: audit
            proxy_engine: transparent
            compose_file: compose.yaml:compose.test-transparent.yaml
            test_dockerfile: test/Dockerfile.transparent-audit
            assert_script: ./test/assert-transparent-audit.sh
            builder_name: buildcage-transparent-audit
          - mode: transparent-restrict
            proxy_mode: restrict
            proxy_engine: transparent
            compose_file: compose.yaml:compose.test-transparent.yaml
            test_dockerfile: test/Dockerfile.transparent-restrict
            assert_script: ./test/assert-transparent-restrict.sh
            builder_name: buildcage-transparent-restrict
          - mode: explicit-audit
            proxy_mode: audit
            proxy_engine: explicit
            compose_file: compose.yaml:compose.test-explicit.yaml
            test_dockerfile: test/Dockerfile.explicit-audit
            assert_script: ./test/assert-explicit-audit.sh
            builder_name: buildcage-explicit-audit
          - mode: explicit-restrict
            proxy_mode: restrict
            proxy_engine: explicit
            compose_file: compose.yaml:compose.test-explicit.yaml
            test_dockerfile: test/Dockerfile.explicit-restrict
            assert_script: ./test/assert-explicit-restrict.sh
            builder_name: buildcage-explicit-restrict

    name: test (${{ matrix.mode }})

    env:
      COMPOSE_FILE: ${{ matrix.compose_file }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build containers
        env:
          PROXY_ENGINE: ${{ matrix.proxy_engine }}
        # Scoped to the services this job actually needs: builder, plus the
        # test-server/test-dns fixtures added by matrix.compose_file's
        # overlay (compose.test-{transparent,explicit}.yaml). compose.yaml
        # also defines a sandbox service (see the sandbox action's own
        # test_sandbox job) that this job has no reason to build/start.
        run: docker compose build builder test-server test-dns

      - name: Start containers
        env:
          PROXY_MODE: ${{ matrix.proxy_mode }}
          PROXY_ENGINE: ${{ matrix.proxy_engine }}
          BUILDER_NAME: ${{ matrix.builder_name }}
        run: docker compose up -d --wait builder test-server test-dns

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          # Without an explicit name, setup-buildx-action generates one, which
          # doesn't match matrix.builder_name — harmless for steps that rely on
          # the implicit default builder (e.g. Build test image below), but
          # assert-explicit-source-policy-conflict.sh invokes `docker buildx
          # build --builder "$BUILDER_NAME"` directly and needs the name to
          # actually resolve.
          name: ${{ matrix.builder_name }}
          driver: remote
          endpoint: docker-container://${{ matrix.builder_name }}

      - name: Build test image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        env:
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: test
          file: ${{ matrix.test_dockerfile }}
          push: false
          no-cache: true
          load: true
          tags: buildcage-test

      - name: Show logs
        if: always()
        env:
          BUILDER_NAME: ${{ matrix.builder_name }}
          INPUT_BUILDER_NAME: ${{ matrix.builder_name }}
        # This job tests proxy enforcement directly, not the report action
        # itself — only test_action's real `uses: ./report` should produce a
        # Job Summary, so print to stdout here instead.
        run: GITHUB_STEP_SUMMARY= node report/src/main.js ./compose.yaml || true

      - name: Run assertions
        env:
          BUILDER_NAME: ${{ matrix.builder_name }}
        run: ${{ matrix.assert_script }}

      - name: Run source-policy conflict assertions
        if: matrix.mode == 'explicit-restrict'
        env:
          BUILDER_NAME: ${{ matrix.builder_name }}
        run: ./test/assert-explicit-source-policy-conflict.sh

      - name: Cleanup
        if: always()
        env:
          BUILDER_NAME: ${{ matrix.builder_name }}
        run: docker compose down -v --rmi all 2>/dev/null || true

  test_multiarch:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test_multiarch == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    name: test (multiarch)

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Build containers
        run: docker compose build builder

      - name: Start containers
        env:
          PROXY_MODE: audit
          BUILDER_NAME: buildcage-multiarch
        run: docker compose up -d --wait builder

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          driver: remote
          endpoint: docker-container://buildcage-multiarch

      - name: Build without specifying platforms
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        env:
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: test
          file: test/Dockerfile.multiarch
          push: false
          load: true
          no-cache: true
          tags: buildcage-multiarch-test:default

      - name: Verify default platform is arm64
        run: |
          ARCH=$(docker run --rm buildcage-multiarch-test:default uname -m)
          echo "Default platform architecture: $ARCH"
          [ "$ARCH" = "aarch64" ] || (echo "Expected aarch64 (native), got $ARCH" && exit 1)
          echo "✓ Default platform is linux/arm64 (native runner architecture)"

      - name: Build for linux/amd64
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        env:
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: test
          file: test/Dockerfile.multiarch
          platforms: linux/amd64
          push: false
          load: true
          no-cache: true
          tags: buildcage-multiarch-test:amd64

      - name: Verify amd64 cross-platform build
        run: |
          ARCH=$(docker run --rm --platform linux/amd64 buildcage-multiarch-test:amd64 uname -m)
          echo "linux/amd64 image architecture: $ARCH"
          [ "$ARCH" = "x86_64" ] || (echo "Expected x86_64, got $ARCH" && exit 1)
          echo "✓ linux/amd64 cross-platform build verified"

      - name: Cleanup
        if: always()
        env:
          BUILDER_NAME: buildcage-multiarch
        run: docker compose down -v --rmi all 2>/dev/null || true

  # Exercises the real setup/report actions end-to-end (uses: ./setup,
  # uses: ./report) against an image built from this branch, no registry
  # involved — see docs/development.md#local-development.
  test_action:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test_action == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        proxy_engine: [transparent, explicit]

    name: test (action, ${{ matrix.proxy_engine }})

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Build local buildcage image
        env:
          PROXY_ENGINE: ${{ matrix.proxy_engine }}
        run: docker compose build builder

      - name: Resolve local image ref
        id: local_image
        # Scoped to the builder service: compose.yaml defines more than one
        # service (see the sandbox action's own test_sandbox job), and
        # `--images` with no service argument emits one line per service,
        # which doesn't fit GITHUB_OUTPUT's single-line key=value format.
        run: echo "ref=$(docker compose config --images builder)" >> "$GITHUB_OUTPUT"

      - name: Rebuild setup action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: pnpm build

      # Default builder_name is fine: each matrix entry runs on its own VM.
      - name: Start Buildcage builder via the real setup action
        uses: ./setup
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
        with:
          proxy_mode: restrict
          proxy_engine: ${{ matrix.proxy_engine }}
          allowed_https_rules: registry.npmjs.org:443

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          driver: remote
          # Matches setup/action.yml's default builder_name — update together.
          endpoint: docker-container://buildcage

      - name: Create test Dockerfile
        run: |
          mkdir -p /tmp/build-context
          cat <<'EOF' > /tmp/build-context/Dockerfile
          FROM node:24-alpine
          WORKDIR /app
          # NODE_USE_SYSTEM_CA=1: required for the explicit engine (always
          # MITMs TLS); harmless for transparent.
          RUN npm init -y && NODE_USE_SYSTEM_CA=1 npm install --ignore-scripts express
          RUN wget -q -O /dev/null --timeout=5 https://example.com/ || true
          EOF

      - name: Build test image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        env:
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: /tmp/build-context
          push: false
          no-cache: true

      - name: Show proxy report
        if: always()
        uses: ./report
        with:
          fail_on_blocked: false

      # No cleanup step: ephemeral runner, and setup's post-hook already
      # stops the container.

  # Exercises the real sandbox action end-to-end (uses: ./sandbox) on the
  # actual runner host — run-isolated.sh needs to unshare/veth/setpriv
  # directly on the host, matching what happens in a real workflow, so
  # (unlike test_action's Docker-build tests) this can't be validated inside
  # a nested container the way the mac dev loop does (see sandbox/dev/ and
  # docs/development.md).
  test_sandbox:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test_sandbox == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: test (sandbox)

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Build local sandbox proxy image
        run: docker compose build sandbox

      - name: Resolve local image ref
        id: local_image
        run: echo "ref=$(docker compose config --images sandbox)" >> "$GITHUB_OUTPUT"

      - name: Rebuild sandbox action with the local-image test hook enabled
        env:
          BUILDCAGE_BUILD_TEST_HOOKS: "1"
        run: pnpm build

      - name: Run an isolated command via the real sandbox action
        uses: ./sandbox
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
          # GITHUB_STEP_SUMMARY is unique per step and can't be reassigned —
          # GitHub silently ignores attempts to override GITHUB_*/RUNNER_*
          # env vars — so a later step has no way to read this step's copy
          # back. Leave GITHUB_STEP_SUMMARY itself untouched (the real Job
          # Summary page still shows this step's report) and additionally
          # mirror it to this debug-only path a later step can check.
          BUILDCAGE_SANDBOX_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-test-summary.md
        with:
          allowed_https_rules: example.com:443
          allowed_http_rules: example.com:80
          # This test intentionally triggers blocked connections (below) to
          # verify enforcement — that's expected, not a failure, so don't
          # let the default fail_on_blocked treat it as one.
          fail_on_blocked: false
          run: |
            echo "=== capability / privilege-escalation checks ==="
            grep -E 'CapEff|NoNewPrivs' /proc/self/status
            grep -q '^CapEff:[[:space:]]*0000000000000000$' /proc/self/status
            grep -q '^NoNewPrivs:[[:space:]]*1$' /proc/self/status

            echo "=== allowlisted HTTP host must be reachable ==="
            wget -q -T 5 -O /dev/null http://example.com/

            echo "=== allowlisted HTTPS host must be reachable ==="
            wget -q -T 5 -O /dev/null https://example.com/

            echo "=== non-allowlisted HTTP host must be blocked (isolation-escape check) ==="
            if wget -q -T 5 -O /dev/null http://neverssl.com/ 2>&1; then
              echo "UNEXPECTED: neverssl.com was reachable"
              exit 1
            fi
            echo "OK: neverssl.com correctly blocked"

            echo "=== non-allowlisted HTTPS host must be blocked ==="
            if wget -q -T 5 -O /dev/null https://example.org/ 2>&1; then
              echo "UNEXPECTED: example.org (HTTPS) was reachable"
              exit 1
            fi
            echo "OK: example.org (HTTPS) correctly blocked"

      - name: Verify the sandbox report contains the expected allowed/blocked entries
        if: always()
        env:
          # Not GITHUB_STEP_SUMMARY: reassigning that reserved var is
          # silently ignored by GitHub, so assert-sandbox.sh reads this
          # debug-only mirror path directly instead (see the note on the
          # step above).
          BUILDCAGE_SANDBOX_DEBUG_SUMMARY_FILE: ${{ runner.temp }}/sandbox-test-summary.md
        run: ./test/assert-sandbox.sh

      # fail_on_blocked defaults to true and is exercised nowhere above (the
      # step above opts out of it to isolate the network-enforcement check
      # from this one) — verify the default itself actually fails a step
      # when a blocked connection occurs.
      - name: Run an isolated command that triggers a blocked connection
        id: blocked_connection
        continue-on-error: true
        uses: ./sandbox
        env:
          BUILDCAGE_LOCAL_IMAGE_REF: ${{ steps.local_image.outputs.ref }}
        with:
          allowed_https_rules: example.com:443
          allowed_http_rules: example.com:80
          # fail_on_blocked intentionally left at its default (true).
          run: wget -q -T 5 -O /dev/null http://neverssl.com/ || true

      - name: Verify fail_on_blocked actually failed the step
        if: always()
        run: |
          if [ "${{ steps.blocked_connection.outcome }}" != "failure" ]; then
            echo "::error::Expected the blocked-connection step to fail (fail_on_blocked defaults to true), but it reported '${{ steps.blocked_connection.outcome }}'"
            exit 1
          fi
          echo "OK: fail_on_blocked correctly failed the step"

      # No cleanup step: the sandbox action stops its own throwaway proxy
      # container in its own finally block (post.js is a fallback only).

  # Single, stably-named required status check for branch protection: the
  # `test` job's own name varies per matrix entry (test (transparent-audit),
  # test (explicit-restrict), etc.), so branch protection can't target it
  # directly without listing every combination and having to update that list
  # whenever the matrix changes.
  all-tests-passed:
    name: All tests passed
    runs-on: ubuntu-latest
    needs: [changes, unit_test, test, test_multiarch, test_action, test_sandbox]
    if: always()
    permissions: {}
    steps:
      - name: Check whether all required jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
          echo "All required jobs succeeded."
