name: Test / Integration
run-name: Test / Integration (${{ github.ref_name }})

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    name: changes
    if: github.event_name == 'pull_request'
    outputs:
      test: ${{ steps.filter.outputs.test }}
      test_multiarch: ${{ steps.filter.outputs.test_multiarch }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docker: &docker
              - 'src/**'
              - 'docker/**'
              - 'compose.yaml'
            workflow: &workflow
              - '.github/workflows/test-integration.yml'
              # Every job below is a make target.
              - 'Makefile'

            test:
              - *docker
              - *workflow
              - 'compose.test-universal.yaml'
              - 'compose.test-explicit.yaml'
              - 'compose.test-inspect.yaml'
              - 'test/**'
              - 'report/src/**'
            test_multiarch:
              - *docker
              - *workflow
              - 'test/Dockerfile.multiarch'
              - 'test/assert-multiarch.sh'

  # Every job here runs the same `make` target a developer runs, so the set CI
  # covers and the set `make test_integration_buildkit` covers are one list,
  # kept in the Makefile.
  test:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: universal-audit
            target: test_integration_buildkit_universal_audit
            test_compose_file: compose.test-universal.yaml
          - mode: universal-restrict
            target: test_integration_buildkit_universal_restrict
            test_compose_file: compose.test-universal.yaml
          - mode: universal-restrict-no-traffic
            target: test_integration_buildkit_universal_restrict_no_traffic
            test_compose_file: compose.test-universal.yaml
          - mode: universal-known-blocked
            target: test_integration_buildkit_universal_known_blocked
            test_compose_file: compose.test-universal.yaml
          - mode: explicit-audit
            target: test_integration_buildkit_explicit_audit
            test_compose_file: compose.test-explicit.yaml
          - mode: explicit-restrict
            target: test_integration_buildkit_explicit_restrict
            test_compose_file: compose.test-explicit.yaml
          - mode: inspect-restrict
            target: test_integration_buildkit_inspect_restrict
            test_compose_file: compose.test-inspect.yaml
          - mode: inspect-debian-audit
            target: test_integration_buildkit_inspect_debian_audit
            test_compose_file: compose.test-inspect.yaml
          - mode: inspect-debian-restrict
            target: test_integration_buildkit_inspect_debian_restrict
            test_compose_file: compose.test-inspect.yaml

    name: "integration: test (${{ matrix.mode }})"

    env:
      # The Makefile builds for the development machines' arm64; here the
      # runner's own architecture is what these tests should exercise.
      TEST_PLATFORM: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The targets run report/src/main.ts and src/post.ts straight from
      # source, and both import @actions/core, so node_modules must exist.
      - uses: ./.github/actions/setup-vp

      # These jobs test proxy enforcement, not the report action itself: only
      # test-e2e.yml's real `uses: ./report` should produce a Job Summary, so
      # the report the target runs prints to stdout instead.
      - name: Run integration tests
        run: GITHUB_STEP_SUMMARY= make ${{ matrix.target }}

      # The target prints the report itself before asserting; this covers a
      # failure earlier than that, where nothing has printed the log yet.
      - name: Show logs
        if: failure()
        run: GITHUB_STEP_SUMMARY= make report_buildkit || true

      - name: Cleanup
        if: always()
        env:
          TEST_COMPOSE_FILE: ${{ matrix.test_compose_file }}
        run: make clean_buildkit 2>/dev/null || true

  test_inspect_roundtrip:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    name: "integration: test (inspect round trip)"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      # Two phases, the second configured by the first, so this is one script
      # rather than a matrix entry: the rules an audit run generates are fed
      # straight back as restrict and must both permit what happened and
      # refuse what did not. Phase 1 is also the suite's only build of
      # test/Dockerfile.inspect-audit, so it carries the audit-mode
      # assertions too.
      - name: Assert the audit run, then enforce the rules it generated
        run: make test_integration_buildkit_inspect_roundtrip

      # The audit assertions read the proxy log without printing it, so this is
      # the only place a failure in them shows what the build actually did.
      - name: Show logs
        if: failure()
        run: GITHUB_STEP_SUMMARY= make report_buildkit || true

      - name: Cleanup
        if: always()
        env:
          TEST_COMPOSE_FILE: compose.test-inspect.yaml
        run: make clean_buildkit 2>/dev/null || true

  test_inspect_byte_exact:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    name: "integration: test (inspect byte-exact)"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vp

      # Brings up inspect, then universal, one after the other (both use the
      # same builder name), so this is one script rather than a matrix entry.
      - name: Compare inspect and universal layer-for-layer
        run: make test_integration_buildkit_inspect_byte_exact

      - name: Cleanup
        if: always()
        env:
          TEST_COMPOSE_FILE: compose.test-inspect.yaml
        run: |
          make clean_buildkit 2>/dev/null || true
          rm -f /tmp/buildcage-byte-exact-inspect.tar /tmp/buildcage-byte-exact-universal.tar

  # Separate job from the others: brings the builder up on its own, with no
  # build running and no fixture network, so buildcage0 never exists, proving
  # :10024/:53 stay unreachable from anywhere else rather than merely reachable
  # from the one interface the jobs above exercise.
  test_listener_scope:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: "integration: test (listener scope, both engines)"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run listener-scope integration tests
        run: make test_integration_buildkit_listener_scope

  test_multiarch:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.test_multiarch == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    name: "integration: test (multiarch)"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The cross-platform half of the target runs the built image, which
      # needs the emulator registered on the runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Build for the default and the other platform
        run: make test_integration_buildkit_multiarch

      - name: Cleanup
        if: always()
        run: make clean_buildkit 2>/dev/null || true

  # Single, stably-named required status check for branch protection: the
  # `test` job's own name varies per matrix entry (test (universal-audit),
  # test (explicit-restrict), etc.), so branch protection can't target it
  # directly without listing every combination and having to update that list
  # whenever the matrix changes.
  integration-tests-passed:
    name: Integration tests passed
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        test,
        test_inspect_roundtrip,
        test_inspect_byte_exact,
        test_listener_scope,
        test_multiarch,
      ]
    if: always()
    permissions: {}
    steps:
      - name: Check whether all required jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
          echo "All required jobs succeeded."
