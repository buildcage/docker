name: Example (universal engine, audit mode)

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # The universal engine reads the SNI without decrypting, so nothing in
      # the build has to trust an injected CA. A JVM build needs that: Maven
      # verifies TLS against the JVM's own cacerts store and ignores the
      # CA-trust environment variables the inspect engine sets.
      #
      # audit blocks nothing and records every destination. The report's
      # "Switch to restrict mode" section returns them as allowed_https_rules.
      - name: Start Buildcage builder
        uses: buildcage/docker@806c35dcae3da9f5f5914e7c6086fde53f9cb24a # v3.1.5
        with:
          proxy_mode: audit
          proxy_engine: universal

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: remote
          endpoint: docker-container://buildcage

      - name: Create test Dockerfile
        run: |
          mkdir -p /tmp/build-context
          cat <<'EOF' > /tmp/build-context/Dockerfile
          FROM maven:3-eclipse-temurin-21-alpine
          WORKDIR /app
          RUN mvn -B dependency:get -Dartifact=org.apache.commons:commons-lang3:3.17.0
          # Nothing in the build needs this. audit records it like any other
          # destination, so leave it out of the rules you paste back in.
          RUN wget -q -O /dev/null --timeout=5 https://example.com/ || true
          EOF

      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: /tmp/build-context
          push: false
          no-cache: true

      - name: Show proxy report
        if: always()
        uses: buildcage/docker/report@806c35dcae3da9f5f5914e7c6086fde53f9cb24a # v3.1.5
