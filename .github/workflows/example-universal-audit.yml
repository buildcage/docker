name: Example (universal engine, audit mode)

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # universal reads the SNI without decrypting, so the build needs no
      # injected CA. audit records every destination, and the report's "Switch
      # to restrict mode" section lists them as allowed_https_rules.
      - name: Start Buildcage builder
        uses: buildcage/docker@ef2b79a3baaddc6a69c1b10a2c473a134ece2eca # v4.4.0
        with:
          proxy_mode: audit
          proxy_engine: universal

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: remote
          endpoint: docker-container://buildcage

      - name: Create test Dockerfile
        run: |
          mkdir -p /tmp/build-context
          cat <<'EOF' > /tmp/build-context/Dockerfile
          FROM maven:3-eclipse-temurin-21-alpine
          WORKDIR /app
          RUN mvn -B dependency:get -Dartifact=org.apache.commons:commons-lang3:3.17.0
          EOF

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: /tmp/build-context
          push: false
          no-cache: true

      - name: Show proxy report
        if: always()
        uses: buildcage/docker/report@ef2b79a3baaddc6a69c1b10a2c473a134ece2eca # v4.4.0
