name: Example (sandbox action)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Only needed for self-hosting under a private GHCR package; the public
      # dash14/buildcage image is pulled anonymously and needs no login.
      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests with outbound network isolation
        # For self-hosting, replace with: <your-org>/buildcage/sandbox@<SHA>
        uses: dash14/buildcage/sandbox@0f4a487d1062628ed90ca3cea661db00890c5e8c # v2.2.0
        with:
          proxy_mode: restrict
          allowed_https_rules: >-
            registry.npmjs.org:443
          # This step intentionally triggers a blocked connection below to
          # demonstrate enforcement — that's expected, not a failure.
          fail_on_blocked: false
          run: |
            npm init -y
            npm install --ignore-scripts express

            echo "=== allowlisted host must be reachable ==="
            npm ping

            echo "=== non-allowlisted host must be blocked ==="
            wget -q -O /dev/null --timeout=5 https://example.com/ || true
