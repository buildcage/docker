services:
  # inspect-engine overlay. Unlike the universal overlay, the builder needs
  # to trust the fixtures' certificate: this engine verifies the origin when it
  # connects, so a self-signed test server would otherwise be a 503 in every
  # case and nothing downstream would be exercised.
  builder:
    build:
      args:
        # Compiles in the test-only extra-CA hook (see docker/inspect/Dockerfile).
        # Never set for real builds/releases.
        BUILDCAGE_TEST_HOOKS: "1"
    environment:
      TEST_NET_ADDR: 10.200.0.2/24
      TEST_NET_SUBNET: ${TEST_NET_SUBNET:-10.210.0.0/24}
      EXTERNAL_RESOLVER: 10.200.0.53
      # These tests drive compose directly, so this stands in for what the
      # action computes. Nothing answers on it, so only the guard can block it.
      HOST_ADDRESSES: 10.200.0.199
      BUILDCAGE_EXTRA_CA_FILE: /test-fixtures/test-server-cert.pem
      # The rules live here rather than in the Makefile so CI, which drives
      # compose directly, tests the same ones. audit ignores them all.
      ALLOWED_HTTPS_RULES: "sub.wildcard.example.com:443 absent.example.com:443 v6only.example.com:443 metadata.example.com:443 runner.example.com:443"
      ALLOWED_HTTP_RULES: allowed.example.com:80
      # The ~regex rule reuses tlspass.example.com on a second port, so a
      # host regex that was mangled as a wildcard would break the existing
      # :443 rule too, not just fail to add the new port.
      ALLOWED_TLS_RULES: "tlspass.example.com:443 ~^tlspass\\.example\\.com:8443$"
      # 9080 is distinct from the :80 the URL rule below already allows, so
      # reaching it proves this rule's own doing.
      ALLOWED_IP_RULES: "~^10\\.200\\.0\\.\\d+:9080$"
      ALLOWED_URL_RULES: |
        GET https://allowed.example.com/public/**
        GET https://allowed.example.com:9443/public/**
        GET|POST https://api.example.com/v1/*
        GET http://10.200.0.100/pub-by-addr/**

        # The one real, non-fixture host: apt has to bootstrap ca-certificates
        # over the real archive before it has anything of its own to reuse the
        # fixture with (see Dockerfile.inspect-debian).
        GET http://deb.debian.org/debian/**
        GET http://deb.debian.org/debian-security/**

        # Scoped by path, unlike sub.wildcard.example.com: DNS cannot see that
        # scoping, so this proves a name matching only the wildcard host is
        # never resolved for real.
        GET https://*.wildcard.example.com/public/**

        # Reuses blocked.example.com (see [Blocked host]), so it needs no cert
        # or DNS entry of its own.
        GET ~^https://blocked\.example\.com:9443/public/.*$

        # No port at all: matches only the scheme's default (443), not 9443
        # above -- a ~ URL rule's port is optional, unlike the other kinds.
        GET ~^https://blocked\.example\.com/defaultport/.*$

        # Neither anchor written: the host half is anchored for the author,
        # so not-ok.wildcard.example.com is refused, while the path half is
        # left as written and /regexpub/ stays a prefix.
        GET ~https://ok\.wildcard\.example\.com/regexpub/

        # The "$" is the author's own and must survive: /regexexactly must
        # not match a rule naming /regexexact.
        GET ~^https://ok\.wildcard\.example\.com/regexexact$

        # Never requested: this is here so real HAProxy sees a path pattern
        # carrying the characters its own config parser folds. Unescaped, the
        # `#` would comment the line short and leave the regex as `^/frag(x`,
        # and the `'` would open a quoted string -- either way haproxy refuses
        # the config and this job fails, which is the point. A pattern that
        # stayed valid when cut short would regress in silence.
        GET ~^https://blocked\.example\.com/frag(x#y|'z)$
    volumes:
      - ./test/test-server-inspect/cert.pem:/test-fixtures/test-server-cert.pem:ro
      - ./test/test-net-addr/attach.sh:/test-hooks/attach-test-net-addr.sh:ro
    # Wrapped here rather than in the image: the builder is the product image
    # and carries no test-only setup.
    entrypoint: ["/test-hooks/attach-test-net-addr.sh", "/init"]
    networks:
      default:
      test-net:

  # The origin every allowed name resolves to. Distinguishes paths and echoes
  # the method, so a path or method rule can be told to have actually applied.
  test-server:
    build: test/test-server-inspect
    cap_add:
      - NET_ADMIN
    environment:
      - TEST_NET_ADDR=10.200.0.100/24
    networks:
      test-net:

  # A second origin nothing resolves to. Reaching it means the destination came
  # from the client rather than from the proxy's own resolution.
  test-server-impostor:
    build: test/test-server-impostor
    cap_add:
      - NET_ADMIN
    environment:
      - TEST_NET_ADDR=10.200.0.101/24
    networks:
      test-net:

  # Echoes whatever UDP it is sent. A build must not be able to reach it, and
  # a container beside it must, or "unreachable" would prove nothing.
  test-udp-echo:
    build: test/test-udp-echo
    cap_add:
      - NET_ADMIN
    environment:
      - TEST_NET_ADDR=10.200.0.102/24
    networks:
      test-net:

  # Upstream for the builder's HAProxy, which resolves the real destination
  # against it once a request has already passed the rules; CoreDNS itself
  # never forwards here.
  test-dns:
    build: test/test-dns-inspect
    cap_add:
      - NET_ADMIN
    environment:
      - TEST_NET_ADDR=10.200.0.53/24
    networks:
      test-net:

networks:
  # Pinned rather than auto-assigned: Docker's pool includes 172.20.0.0/16,
  # which collides with the builder's CNI bridge inside its netns.
  test-net:
    ipam:
      config:
        - subnet: ${TEST_NET_SUBNET:-10.210.0.0/24}
