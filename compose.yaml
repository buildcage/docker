# Builds the builder image from this checkout. How it runs is set in
# docker/compose.action.yaml, the file the action starts it from, and in the
# test overlays the integration tests layer on it.
# `make setup_buildkit_*` builds through this, then starts the image through
# the setup action.
services:
  builder:
    # A test that builds an image of its own names it in BUILDCAGE_BUILDER_IMAGE.
    image: ${BUILDCAGE_BUILDER_IMAGE:-buildcage-builder${BUILDCAGE_WORKTREE_SUFFIX:-}}
    build:
      context: .
      dockerfile: docker/${PROXY_ENGINE:-inspect}/Dockerfile
