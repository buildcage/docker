services:
  # Test HTTP server (with self-signed certificate)
  test-server:
    build: test/test-server
    networks:
      test-net:
        ipv4_address: 10.200.0.100

  # DNS used by builder (resolves all domains to test-server)
  test-dns:
    build: test/test-dns
    networks:
      test-net:
        ipv4_address: 10.200.0.53

networks:
  test-net:
    ipam:
      config:
        - subnet: 10.200.0.0/24
