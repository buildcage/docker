[dns]
# The steps' resolver, not buildkitd's own: the daemon keeps using the builder
# container's resolv.conf, so `FROM` still reaches a real registry.
nameservers = ["198.19.255.1"]
# "." empties the search list; [] would keep the one Docker copied from the
# runner, so a failed lookup would be retried under *.internal.cloudapp.net.
searchDomains = ["."]

[worker.oci]
enabled = true
# Not "auto", which falls back to native without saying so: buildcage-runc
# reads each step's layer back through its overlay upper directory
# (s6-scripts/init-overlay-check fails the start without one).
snapshotter = "overlayfs"
networkMode = "cni"
cniConfigPath = "/etc/buildkit/cni.conflist"
cniPoolSize = 16
cniPortForward = true
# Replaces buildkit-runc with buildcage's wrapper, which makes each step trust
# the proxy's CA and puts the trust store back before the snapshot is committed.
binary = "/opt/buildcage/bin/buildcage-runc"

[[worker.oci.gcpolicy]]
all = true
