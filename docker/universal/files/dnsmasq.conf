# DNS configuration file

# Enable query logging
log-queries

# Do not read /etc/resolv.conf
no-resolv

# Do not use upstream DNS servers
no-poll

# Redirect all domains to the proxy gateway (this container)
address=/#/172.20.0.1

# Disable IPv6
address=/#/::

# Act as local authority by default
local-service
bogus-priv
no-hosts

# Port configuration
port=53

# Drop privileges after binding to port 53
user=dnsmasq
group=dnsmasq

# Interface to bind to
bind-interfaces
listen-address=0.0.0.0

# Cache size
cache-size=1000

# Log facility
log-facility=-
