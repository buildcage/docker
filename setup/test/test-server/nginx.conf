events {
    worker_connections 128;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr;

    server {
        listen 80;
        listen 8080;
        return 200 "OK\n";
    }

    server {
        listen 443 ssl;
        listen 8443 ssl;
        ssl_certificate /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;
        return 200 "OK\n";
    }
}
