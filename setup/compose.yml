services:
  builder:
    image: ${BUILDCAGE_IMAGE:-ghcr.io/dash14/buildcage}:${BUILDCAGE_VERSION:-1}
    privileged: true
    ports:
      - "${PORT:-1234}:1234"
    environment:
      - PROXY_MODE=${PROXY_MODE:-restrict}
      - ALLOWED_HTTP_DOMAINS=${ALLOWED_HTTP_DOMAINS:-}
      - ALLOWED_HTTPS_DOMAINS=${ALLOWED_HTTPS_DOMAINS:-}
      - HTTP_PORTS=${HTTP_PORTS:-80}
      - HTTPS_PORTS=${HTTPS_PORTS:-443}
      - EXTERNAL_RESOLVER=${EXTERNAL_RESOLVER:-1.1.1.1 8.8.8.8 valid=300s}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost/health && nc -z localhost 1234"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 5s
