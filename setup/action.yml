name: Setup Builder
description: Start Buildcage builder container

inputs:
  buildcage_image:
    description: "Docker image name (default: ghcr.io/<action-owner>/<action-repo>)"
    required: false
  buildcage_version:
    description: "Image tag"
    required: false
  builder_name:
    description: "Name of the builder container"
    required: false
    default: 'buildcage'
  proxy_mode:
    description: "audit or restrict"
    required: false
    default: 'restrict'
  allowed_https_rules:
    description: "HTTPS allow rules (wildcard or ~regex), separated by whitespace. Port required. e.g., '*.example.com:443 ~^custom\\.pattern:443$'"
    required: false
    default: ''
  allowed_http_rules:
    description: "HTTP allow rules (wildcard or ~regex), separated by whitespace. Port required. e.g., 'example.com:80'"
    required: false
    default: ''
  allowed_ip_rules:
    description: "IP address allow rules (wildcard or ~regex), separated by whitespace. Port required. e.g., '192.168.1.1:443 10.0.0.1:8080'"
    required: false
    default: ''


runs:
  using: node24
  main: dist/main.mjs
  post: dist/post.mjs
