name: Setup Builder
description: Start buildcage builder container

inputs:
  buildcage_image:
    description: "Docker image name (default: ghcr.io/<owner>/<repo>)"
    required: false
  buildcage_version:
    description: "Image tag"
    required: false
    default: '1'
  proxy_mode:
    description: "audit or restrict"
    required: false
    default: 'restrict'
  allowed_http_domains:
    description: "Comma-separated allowed HTTP domains"
    required: false
    default: ''
  allowed_https_domains:
    description: "Comma-separated allowed HTTPS domains"
    required: false
    default: ''
  http_ports:
    description: "Comma-separated HTTP listen ports for the proxy (e.g. 80,8080)"
    required: false
    default: '80'
  https_ports:
    description: "Comma-separated HTTPS listen ports for the proxy (e.g. 443,8443)"
    required: false
    default: '443'
  port:
    description: "BuildKit endpoint port on localhost"
    required: false
    default: '1234'

outputs:
  port:
    description: "BuildKit endpoint port"

runs:
  using: node24
  main: main.mjs
  post: post.mjs
