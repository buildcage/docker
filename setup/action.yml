name: Setup Builder
description: Start buildcage builder container

inputs:
  buildcage_image:
    description: "Docker image name (default: ghcr.io/<action-owner>/<action-repo>)"
    required: false
  buildcage_version:
    description: "Image tag"
    required: false
  proxy_mode:
    description: "audit or restrict"
    required: false
    default: 'restrict'
  allowed_https_rules:
    description: "HTTPS allow rules (wildcard or ~regex), separated by whitespace. Port required. e.g., '*.example.com:443 192.168.1.1:443 ~^custom\\.pattern:443$'"
    required: false
    default: ''
  allowed_http_rules:
    description: "HTTP allow rules (wildcard or ~regex), separated by whitespace. Port required. e.g., 'example.com:80 192.168.1.1:8080'"
    required: false
    default: ''
  # Deprecated
  allowed_http_domains:
    description: "Deprecated: use allowed_http_rules instead"
    required: false
    default: ''
  allowed_https_domains:
    description: "Deprecated: use allowed_https_rules instead"
    required: false
    default: ''
  http_ports:
    description: "Deprecated: specify port per rule in allowed_http_rules (e.g., 'example.com:8080')"
    required: false
    default: '80'
  https_ports:
    description: "Deprecated: specify port per rule in allowed_https_rules (e.g., 'example.com:8443')"
    required: false
    default: '443'
  port:
    description: "BuildKit endpoint port on localhost"
    required: false
    default: '1234'

outputs:
  port:
    description: "BuildKit endpoint port"

runs:
  using: node24
  main: main.mjs
  post: post.mjs
