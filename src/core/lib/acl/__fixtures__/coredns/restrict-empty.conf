# Reverse lookups: answered NXDOMAIN rather than left unhandled, which
# would be SERVFAIL and cost musl a five-second timeout each time. Only a
# reversed address is treated this way; anything else
# under these zones misses the view and falls through to the blocks below.
in-addr.arpa ip6.arpa {
    view reverse {
      expr name() matches '(?i)^(([0-9]{1,3}[.]){1,4}in-addr[.]arpa|([0-9a-fA-F][.]){1,32}ip6[.]arpa)[.]$'
    }
    template IN PTR {
      rcode NXDOMAIN
      authority "{{ .Zone }} 60 IN SOA ns.buildcage.invalid. hostmaster.buildcage.invalid. 1 60 60 60 60"
    }
    template IN A {
      answer "{{ .Name }} 60 IN A 198.19.255.1"
    }
    template IN AAAA {
    }
    template IN ANY {
    }
    log . "buildcage dns reverse name={name}"
    errors
}

# Every other service name: blocked like any other name, but recorded apart
# so the report can say the remedy is the host below it rather than the name
# itself, which no rule can make resolve.
. {
    view service {
      expr name() matches '(?i)^_[a-z0-9-]{1,15}[.]_(tcp|udp|sctp)[.].+[.]$'
    }
    template IN A {
      answer "{{ .Name }} 60 IN A 198.19.255.1"
    }
    template IN AAAA {
    }
    template IN ANY {
    }
    log . "buildcage dns service-denied name={name} type={type}"
    errors
}

