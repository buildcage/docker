# Generated by buildcage. Do not edit.

global
    log stdout len 16384 format raw local0
    nbthread 1
    user haproxy
    group haproxy
    dns-accept-family ipv4
    # normalize-uri is still marked experimental upstream.
    expose-experimental-directives
    tune.ssl.default-dh-param 2048

defaults
    log global
    timeout connect 5s
    timeout client 30s
    timeout server 30s

# Readiness for s6-notifyoncheck, and the dropped-log count for the report.
# Not reachable from the network.
frontend health
    bind /var/run/haproxy-health.sock mode 666
    mode http
    no log
    monitor-uri /health
    http-request use-service prometheus-exporter if { path /metrics }

# Real resolution happens once a request has already passed the rule
# ACLs below; the build's own resolver (CoreDNS) never gives out a real
# answer, so this is the only place a name becomes an address.
resolvers buildcage
    parse-resolv-conf
    hold valid 60s
    resolve_retries 4
    timeout retry 1s
    accepted_payload_size 8192

# One listener for everything redirected here. The first bytes say whether
# this is a handshake or a plain request, so no port has to be declared as
# one or the other in advance.
frontend detect
    bind *:10024
    mode tcp
    tcp-request inspect-delay 5s

    no log

    # `accept` ends content-rule evaluation, so it comes after every rule
    # that needs the request buffer (the SNI capture and resolution above).
    # Separate rules: while a ClientHello is incomplete the first one waits
    # for the rest, where an `||` would accept on its first segment.
    tcp-request content accept if { req.ssl_hello_type 1 }
    tcp-request content accept if { req.len gt 0 }

    acl is_tls req.ssl_hello_type 1
    use_backend to_tls if is_tls
    default_backend to_plain

backend passthrough
    mode tcp
    server origin 0.0.0.0

backend to_tls
    mode tcp
    server s 127.0.0.1:10025 send-proxy-v2

backend to_plain
    mode tcp
    server s 127.0.0.1:10026 send-proxy-v2

frontend https_in
    bind 127.0.0.1:10025 accept-proxy ssl crt /etc/haproxy/default.pem generate-certificates ca-sign-file /etc/haproxy/ca.pem
    mode http
    http-request set-var(txn.host_log) 'req.hdr(host),regsub("[\s\"[:cntrl:]]",_,g)'

    # Decode before stripping `..`: `.` is unreserved, so `%2e%2e` is not
    # a dot-dot segment until decoded, and stripping first would miss it.
    http-request normalize-uri percent-decode-unreserved
    http-request normalize-uri path-strip-dotdot

    # pathq, not %HU: %HU is the target as sent (a path over HTTP/1.1, an
    # absolute URI over HTTP/2), and pathq is not readable at log time.
    # Set after normalization, so the log shows the path the rules matched.
    http-request set-var(txn.pathq) 'pathq,regsub("[\"[:cntrl:]]",_,g)'

    # A request with no Host names nothing: the rules match on it, the
    # origin is resolved from it, and the log's URL is built from it. Named
    # here rather than left to the log's own empty fields, which a Host the
    # client chose can imitate. Refused in `audit` too, as the same check
    # in the universal engine is: there is nothing to connect to either way.
    # Ahead of the path denies below, so that a request carrying neither a
    # Host nor a legal path is named by the one the report can act on: the
    # other leaves a row named for the `-` the log prints in its place.
    acl has_host hdr(host) -m found
    acl host_not_empty hdr_len(host) gt 0
    http-request set-var(txn.reason) str(missing-host-header) if !has_host or !host_not_empty
    http-request deny deny_status 400 if !has_host or !host_not_empty

    # The one Host every later step reads. An acl on req.hdr(host) scans
    # every value while a fetch takes the last, so reading the header twice
    # could judge one value and connect to another.
    http-request set-var(txn.host) req.hdr(host),lower,host_only,regsub(\.$,)
    # A `:` left in the name could let a `~` rule's port pattern match it.
    # Refused in `audit` too.
    acl host_is_name var(txn.host) -m reg ^[A-Za-z0-9._-]+$
    http-request set-var(txn.reason) str(invalid-host) if !host_is_name
    http-request deny deny_status 400 if !host_is_name

    # `%2f` and `%5c` survive decoding (both reserved) yet an origin may
    # read `..%2f` / `..%5c` as a segment, and a raw backslash is not a
    # valid path char at all. None is stripped, so each is refused. A lone
    # encoded separator stays legal (e.g. npm's `/@scope%2fpackage`).
    # `;` (or `%3b`) ends a segment too: Tomcat and Jetty drop what follows
    # as a path parameter, so they read `..;/` as `../`.
    # `\\` is one literal backslash: HAProxy's parser takes the pair as one.
    http-request deny deny_status 403 if { path -m reg -i (^|/|%2f|%5c)\.\.($|/|;|%2f|%5c|%3b) }
    http-request deny deny_status 403 if { path -m sub \\ }

    log-format "buildcage %[date(0,ms)] https %HM %ST %B ts=%ts reason=%[var(txn.reason)] tlserr=%[ssl_bc_err] dst=%[dst]:%[dst_port] sni=%[ssl_fc_sni,regsub([^A-Za-z0-9._-],_,g)] host=%[var(txn.host_log)] %[var(txn.pathq)]"

    # No rules for this scheme, so nothing is permitted.
    http-request deny

    default_backend origin_tls

frontend http_in
    bind 127.0.0.1:10026 accept-proxy
    mode http
    # detect's client timeout runs from the connection, this frontend's from
    # the hand-off after detect's 5s inspect-delay. Ending a silent client's
    # wait here first logs it as a timeout rather than a close. The
    # keep-alive wait stays at the client timeout.
    timeout http-request 20s
    timeout http-keep-alive 30s
    http-request set-var(txn.host_log) 'req.hdr(host),regsub("[\s\"[:cntrl:]]",_,g)'

    # Decode before stripping `..`: `.` is unreserved, so `%2e%2e` is not
    # a dot-dot segment until decoded, and stripping first would miss it.
    http-request normalize-uri percent-decode-unreserved
    http-request normalize-uri path-strip-dotdot

    # pathq, not %HU: %HU is the target as sent (a path over HTTP/1.1, an
    # absolute URI over HTTP/2), and pathq is not readable at log time.
    # Set after normalization, so the log shows the path the rules matched.
    http-request set-var(txn.pathq) 'pathq,regsub("[\"[:cntrl:]]",_,g)'

    # A request with no Host names nothing: the rules match on it, the
    # origin is resolved from it, and the log's URL is built from it. Named
    # here rather than left to the log's own empty fields, which a Host the
    # client chose can imitate. Refused in `audit` too, as the same check
    # in the universal engine is: there is nothing to connect to either way.
    # Ahead of the path denies below, so that a request carrying neither a
    # Host nor a legal path is named by the one the report can act on: the
    # other leaves a row named for the `-` the log prints in its place.
    acl has_host hdr(host) -m found
    acl host_not_empty hdr_len(host) gt 0
    http-request set-var(txn.reason) str(missing-host-header) if !has_host or !host_not_empty
    http-request deny deny_status 400 if !has_host or !host_not_empty

    # The one Host every later step reads. An acl on req.hdr(host) scans
    # every value while a fetch takes the last, so reading the header twice
    # could judge one value and connect to another.
    http-request set-var(txn.host) req.hdr(host),lower,host_only,regsub(\.$,)
    # A `:` left in the name could let a `~` rule's port pattern match it.
    # Refused in `audit` too.
    acl host_is_name var(txn.host) -m reg ^[A-Za-z0-9._-]+$
    http-request set-var(txn.reason) str(invalid-host) if !host_is_name
    http-request deny deny_status 400 if !host_is_name

    # `%2f` and `%5c` survive decoding (both reserved) yet an origin may
    # read `..%2f` / `..%5c` as a segment, and a raw backslash is not a
    # valid path char at all. None is stripped, so each is refused. A lone
    # encoded separator stays legal (e.g. npm's `/@scope%2fpackage`).
    # `;` (or `%3b`) ends a segment too: Tomcat and Jetty drop what follows
    # as a path parameter, so they read `..;/` as `../`.
    # `\\` is one literal backslash: HAProxy's parser takes the pair as one.
    http-request deny deny_status 403 if { path -m reg -i (^|/|%2f|%5c)\.\.($|/|;|%2f|%5c|%3b) }
    http-request deny deny_status 403 if { path -m sub \\ }

    log-format "buildcage %[date(0,ms)] http %HM %ST %B ts=%ts reason=%[var(txn.reason)] tlserr=%[ssl_bc_err] dst=%[dst]:%[dst_port] host=%[var(txn.host_log)] %[var(txn.pathq)]"

    # No rules for this scheme, so nothing is permitted.
    http-request deny

    default_backend origin_plain

# The only place a request reaches the origin, so where its certificate is
# checked; a refused request never gets here. The SNI is the port-free
# txn.host the rules judged, since a certificate is verified against a name,
# not a name and port.
backend origin_tls
    mode http
    server origin 0.0.0.0 ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt sni var(txn.host)

backend origin_plain
    mode http
    server origin 0.0.0.0
