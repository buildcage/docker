# Generated by buildcage. Do not edit.

global
    log stdout len 16384 format raw local0
    nbthread 1
    user haproxy
    group haproxy
    dns-accept-family ipv4
    # normalize-uri is still marked experimental upstream.
    expose-experimental-directives
    tune.ssl.default-dh-param 2048

defaults
    log global
    timeout connect 5s
    timeout client 30s
    timeout server 30s

# Readiness for s6-notifyoncheck, and the dropped-log count for the report.
# Not reachable from the network.
frontend health
    bind /var/run/haproxy-health.sock mode 666
    mode http
    no log
    monitor-uri /health
    http-request use-service prometheus-exporter if { path /metrics }

# Real resolution happens once a request has already passed the rule
# ACLs below; the build's own resolver (CoreDNS) never gives out a real
# answer, so this is the only place a name becomes an address.
resolvers buildcage
    nameserver ns1 1.1.1.1:53
    nameserver ns2 8.8.8.8:53
    hold valid 60s
    resolve_retries 4
    timeout retry 1s
    accepted_payload_size 8192

# One listener for everything redirected here. The first bytes say whether
# this is a handshake or a plain request, so no port has to be declared as
# one or the other in advance.
frontend detect
    bind *:10024
    mode tcp
    tcp-request inspect-delay 5s

    # Passed through untouched: judged before anything is decrypted.
    # dst is the proxy only when the name went through this container's DNS.
    acl dns_routed dst 198.19.255.1
    # 10.0.0.5:5432
    acl ip0_dst dst 10.0.0.5
    acl ip0_port dst_port 5432
    acl sni_is_name req.ssl_sni -m reg ^[A-Za-z0-9._-]+$
    # db.example.com:443
    acl tls0_sni req.ssl_sni -m reg -i ^db\\.example\\.com$
    acl tls0_port dst_port 443

    tcp-request content set-var(txn.pass) int(1) if ip0_dst ip0_port !dns_routed
    tcp-request content set-var(txn.pass) int(1) if tls0_sni tls0_port sni_is_name
    tcp-request content set-var(txn.sni) req.ssl_sni,regsub([^A-Za-z0-9._-],_,g) if tls0_sni tls0_port sni_is_name
    tcp-request content set-var(txn.proto) str(tls) if { req.ssl_hello_type 1 }
    tcp-request content set-var(txn.proto) str(tcp) unless { req.ssl_hello_type 1 }

    tcp-request content set-var(txn.tlsrule) int(1) if tls0_sni tls0_port sni_is_name
    tcp-request content do-resolve(txn.dst,buildcage,ipv4) req.ssl_sni,lower if { var(txn.tlsrule) -m found }
    tcp-request content set-var(txn.reason) str(dns-failed) if { var(txn.tlsrule) -m found } !{ var(txn.dst) -m found }
    tcp-request content reject if { var(txn.tlsrule) -m found } !{ var(txn.dst) -m found }
    tcp-request content set-dst var(txn.dst) if { var(txn.dst) -m found }
    acl pass_dst_internal var(txn.dst) -m ip 0.0.0.0/8 127.0.0.0/8 169.254.0.0/16 100.64.0.0/10 192.0.0.0/24 168.63.129.16/32 ::1/128 fe80::/10 198.19.255.0/24 198.19.255.1
    tcp-request content set-var(txn.reason) str(internal-address) if { var(txn.tlsrule) -m found } pass_dst_internal
    tcp-request content reject if { var(txn.tlsrule) -m found } pass_dst_internal

    tcp-request content set-log-level silent unless { var(txn.pass) -m found }
    log-format "buildcage %[date(0,ms)] pass %[var(txn.proto)] %B ts=%ts reason=%[var(txn.reason)] dst=%[dst]:%[dst_port] sni=%[var(txn.sni)]"

    # `accept` ends content-rule evaluation, so it comes after every rule
    # that needs the request buffer (the SNI capture and resolution above).
    tcp-request content accept if { req.ssl_hello_type 1 } || { req.len gt 0 }

    use_backend passthrough if { var(txn.pass) -m found }

    acl is_tls req.ssl_hello_type 1
    use_backend to_tls if is_tls
    default_backend to_plain

backend passthrough
    mode tcp
    server origin 0.0.0.0

backend to_tls
    mode tcp
    server s 127.0.0.1:10025 send-proxy-v2

backend to_plain
    mode tcp
    server s 127.0.0.1:10026 send-proxy-v2

frontend https_in
    bind 127.0.0.1:10025 accept-proxy ssl crt /etc/haproxy/default.pem generate-certificates ca-sign-file /etc/haproxy/ca.pem
    mode http
    http-request set-var(txn.host_log) 'req.hdr(host),regsub("[\s\"[:cntrl:]]",_,g)'

    # Decode before stripping `..`: `.` is unreserved, so `%2e%2e` is not
    # a dot-dot segment until decoded, and stripping first would miss it.
    http-request normalize-uri percent-decode-unreserved
    http-request normalize-uri path-strip-dotdot

    # pathq, not %HU: %HU is the target as sent (a path over HTTP/1.1, an
    # absolute URI over HTTP/2), and pathq is not readable at log time.
    # Set after normalization, so the log shows the path the rules matched.
    http-request set-var(txn.pathq) 'pathq,regsub("[\"[:cntrl:]]",_,g)'

    # A request with no Host names nothing: the rules match on it, the
    # origin is resolved from it, and the log's URL is built from it. Named
    # here rather than left to the log's own empty fields, which a Host the
    # client chose can imitate. Refused in `audit` too, as the same check
    # in the universal engine is: there is nothing to connect to either way.
    # Ahead of the path denies below, so that a request carrying neither a
    # Host nor a legal path is named by the one the report can act on: the
    # other leaves a row named for the `-` the log prints in its place.
    acl has_host hdr(host) -m found
    acl host_not_empty hdr_len(host) gt 0
    http-request set-var(txn.reason) str(missing-host-header) if !has_host or !host_not_empty
    http-request deny deny_status 400 if !has_host or !host_not_empty

    # The one Host every later step reads. An acl on req.hdr(host) scans
    # every value while a fetch takes the last, so reading the header twice
    # could judge one value and connect to another.
    http-request set-var(txn.host) req.hdr(host),lower,host_only,regsub(\.$,)
    # A `:` left in the name could let a `~` rule's port pattern match it.
    # Refused in `audit` too.
    acl host_is_name var(txn.host) -m reg ^[A-Za-z0-9._-]+$
    http-request set-var(txn.reason) str(invalid-host) if !host_is_name
    http-request deny deny_status 400 if !host_is_name

    # `%2f` and `%5c` survive decoding (both reserved) yet an origin may
    # read `..%2f` / `..%5c` as a segment, and a raw backslash is not a
    # valid path char at all. None is stripped, so each is refused. A lone
    # encoded separator stays legal (e.g. npm's `/@scope%2fpackage`).
    # `;` (or `%3b`) ends a segment too: Tomcat and Jetty drop what follows
    # as a path parameter, so they read `..;/` as `../`.
    # `\\` is one literal backslash: HAProxy's parser takes the pair as one.
    http-request deny deny_status 403 if { path -m reg -i (^|/|%2f|%5c)\.\.($|/|;|%2f|%5c|%3b) }
    http-request deny deny_status 403 if { path -m sub \\ }

    log-format "buildcage %[date(0,ms)] https %HM %ST %B ts=%ts reason=%[var(txn.reason)] tlserr=%[ssl_bc_err] dst=%[dst]:%[dst_port] sni=%[ssl_fc_sni,regsub([^A-Za-z0-9._-],_,g)] host=%[var(txn.host_log)] %[var(txn.pathq)]"

    # a.example.com:443
    acl s0_host var(txn.host) -m str a.example.com
    acl s0_port dst_port 443
    acl s0_path path -m beg /

    http-request set-var(txn.allowed) bool(false)
    http-request set-var(txn.allowed) bool(true) if !{ var(txn.allowed) -m bool } s0_host s0_port s0_path
    http-request deny unless { var(txn.allowed) -m bool }

    # Connect to the address this proxy resolves the Host to, discarding
    # the client's address, so a forged Host or doctored /etc/hosts cannot
    # choose the target.
    # txn.host has already dropped the port a header carries, which is not
    # part of the name. An address is taken as-is: no resolver can answer
    # one, and the rules above already decided, so nothing is loosened.
    acl host_is_address var(txn.host) -m reg ^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$
    http-request set-var(txn.dst) var(txn.host) if host_is_address
    http-request do-resolve(txn.dst,buildcage,ipv4) var(txn.host) unless host_is_address
    # A fresh attempt, not a replay: nothing cached the failure.
    http-request do-resolve(txn.dst,buildcage,ipv4) var(txn.host) unless host_is_address or { var(txn.dst) -m found }
    http-request set-var(txn.reason) str(dns-failed) unless { var(txn.dst) -m found }
    http-request deny deny_status 502 unless { var(txn.dst) -m found }

    # Set before the internal-destination check below, not after: %[dst] in
    # the log-format is this, and a refusal must show the address that
    # tripped it, not whatever the client's own (fake, unresolved) address
    # was: CoreDNS never hands out a real one; see coredns-config.ts.
    http-request set-dst var(txn.dst)

    # A resolved destination may not be internal; see INTERNAL_RANGES.
    acl dst_internal var(txn.dst) -m ip 0.0.0.0/8 127.0.0.0/8 169.254.0.0/16 100.64.0.0/10 192.0.0.0/24 168.63.129.16/32 ::1/128 fe80::/10 198.19.255.0/24 198.19.255.1
    http-request set-var(txn.reason) str(internal-address) if dst_internal
    http-request deny deny_status 403 if dst_internal

    default_backend origin_tls

frontend http_in
    bind 127.0.0.1:10026 accept-proxy
    mode http
    # detect's client timeout runs from the connection, this frontend's from
    # the hand-off after detect's 5s inspect-delay. Ending a silent client's
    # wait here first logs it as a timeout rather than a close. The
    # keep-alive wait stays at the client timeout.
    timeout http-request 20s
    timeout http-keep-alive 30s
    http-request set-var(txn.host_log) 'req.hdr(host),regsub("[\s\"[:cntrl:]]",_,g)'

    # Decode before stripping `..`: `.` is unreserved, so `%2e%2e` is not
    # a dot-dot segment until decoded, and stripping first would miss it.
